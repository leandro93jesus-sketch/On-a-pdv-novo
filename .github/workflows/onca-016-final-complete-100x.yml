          dotnet-version: '10.0.x'
      - name: Final regression publish installer and smoke
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore
          if($LASTEXITCODE -ne 0){throw "Final tests failed"}
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o .\publish-final
          if(-not(Test-Path '.\publish-final\OncaPDV.Desktop.exe')){throw 'EXE missing'}
      - name: Build NSIS final installer
        shell: pwsh
        run: |
          $dst=".\installer\publish-full";if(Test-Path $dst){Remove-Item $dst -Recurse -Force};Copy-Item ".\work\ONCA-PDV-PRO\publish-final" $dst -Recurse -Force
          choco install nsis -y --no-progress
          $m=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source;if(-not$m){$m=@('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')|?{Test-Path $_}|select -First 1};if(-not$m){throw 'NSIS missing'}
          Push-Location .\installer;& $m '.\ONCA-PDV-PRO-0.1.16-base0111.nsi';if($LASTEXITCODE-ne0){throw 'Installer failed'};Pop-Location
