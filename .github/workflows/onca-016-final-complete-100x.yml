      - name: Layout and protected behavior gate
        shell: pwsh
        run: |
          $root=".\work\ONCA-PDV-PRO";$mx=Get-Content "$root\src\OncaPDV.Desktop\MainWindow.xaml" -Raw;$mc=Get-Content "$root\src\OncaPDV.Desktop\MainWindow.xaml.cs" -Raw;$fo=Get-Content "$root\src\OncaPDV.Desktop\FinalOperationsWindow.xaml" -Raw
          foreach($needle in @('v0.1.16','FinalOps_Click','HoldSale_Click')){if(-not ($mx+$mc).Contains($needle)){throw "Missing protected/layout item: $needle"}}
          foreach($needle in @('MinWidth="980"','MinHeight="680"','HorizontalScrollBarVisibility="Auto"','VerticalScrollBarVisibility="Auto"')){if(-not $fo.Contains($needle)){throw "Final window layout gate failed: $needle"}}
          if(-not $mc.Contains('Deseja imprimir o comprovante?')){throw "Print confirmation missing"};if(-not $mc.Contains('if (shouldPrint)')){throw "Print gate missing"}
      - uses: actions/setup-dotnet@v4
