          $setup=Resolve-Path '.\installer\ONCA-PDV-PRO-Setup-0.1.16-FINAL-COMPLETO.exe'
          for($i=1;$i-le20;$i++){$dir=Join-Path $env:RUNNER_TEMP ("ONCA-final-"+$i);$p=Start-Process -FilePath $setup -ArgumentList @('/S',"/D=$dir") -PassThru -Wait;if($p.ExitCode-ne0){throw "Install failed $i"};$app=Start-Process -FilePath (Join-Path $dir 'OncaPDV.Desktop.exe') -ArgumentList '--smoke-test' -PassThru;if(-not$app.WaitForExit(30000)){try{$app.Kill($true)}catch{};throw "Launch timeout $i"};if($app.ExitCode-ne0){throw "Launch failed $i"}}
