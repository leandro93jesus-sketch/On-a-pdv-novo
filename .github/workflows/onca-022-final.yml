name: ONCA 0.1.22 FINAL
on:
  push:
    paths:
      - '.github/workflows/onca-022-final.yml'
      - 'scripts/apply_features_022.py'
      - 'scripts/fix_022_guid.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-release:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild approved base
        shell: pwsh
        run: .\scripts\rebuild-onca-016-final.ps1
      - name: Apply 0.1.18
        shell: pwsh
        run: python .\scripts\apply_ui_018.py
      - name: Apply 0.1.19
        shell: pwsh
        run: python .\scripts\apply_ui_019.py
      - name: Apply 0.1.20
        shell: pwsh
        run: python .\scripts\apply_ui_020.py
      - name: Apply 0.1.21 physical print
        shell: pwsh
        run: python .\scripts\apply_print_021.py
      - name: Apply 0.1.22 features
        shell: pwsh
        run: python .\scripts\apply_features_022.py
      - name: Fix nullable product id
        shell: pwsh
        run: python .\scripts\fix_022_guid.py
      - name: Verify requested scope
        shell: pwsh
        run: |
          $r='.\work-final\ONCA-PDV-PRO'
          $d="$r\src\OncaPDV.Desktop"
          $main=Get-Content "$d\MainWindow.xaml.cs" -Raw
          $xaml=Get-Content "$d\MainWindow.xaml" -Raw
          $orders=Get-Content "$r\src\OncaPDV.Infrastructure\OrderService022.cs" -Raw
          $credit=Get-Content "$d\CreditWindow.xaml.cs" -Raw
          $creditX=Get-Content "$d\CreditWindow.xaml" -Raw
          $reports=Get-Content "$r\src\OncaPDV.Infrastructure\ReportService022.cs" -Raw
          if($xaml.Contains('Colocar venda em espera')){throw 'Legacy wait-sale nav still visible'}
          foreach($s in @('Pedidos','Orders_Click','Reports022_Click','v0.1.22')){if(-not(($xaml+$main).Contains($s))){throw "Missing requested UI: $s"}}
          foreach($s in @('AwaitingPayment','TryClaimForPaymentAsync','MarkPaidAsync','CancelAsync','UpdateAsync','SearchAsync')){if(-not $orders.Contains($s)){throw "Missing order behavior: $s"}}
          foreach($s in @('EditReceipt_Click','ReverseCreditReceiptAsync')){if(-not $credit.Contains($s)){throw "Missing credit behavior: $s"}}
          foreach($s in @('EDITAR / CORRIGIR RECEBIMENTO','APAGAR / ESTORNAR RECEBIMENTO')){if(-not $creditX.Contains($s)){throw "Missing credit UI: $s"}}
          foreach($s in @('PaidOrders','CancelledSales','CreditReceipts','ONÇA PRODUTOS DE LIMPEZA')){if(-not $reports.Contains($s)){throw "Missing report feature: $s"}}
          if(-not $main.Contains('Cut:true')){throw 'Receipt end cut not wired'}
          if(-not $main.Contains('Deseja imprimir o comprovante?')){throw 'Print confirmation removed'}
          if(-not $main.Contains('ConfiguredPhysicalPrintService')){throw 'Physical printing wiring removed'}
          if($main.Contains('EnsureDailyBackupAsync')){throw 'Automatic backup reintroduced'}
      - name: Full regression tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
      - name: Build Desktop warnings as errors
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj --configfile .\NuGet.Config
          dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
      - name: Publish EXE
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\portable022
          Copy-Item '.\portable022\OncaPDV.Desktop.exe' '.\portable022\ONCA-PDV-PRO-0.1.22-PEDIDOS-CREDIARIO-RELATORIOS.exe' -Force
      - name: Smoke launch 5x
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $exe=Resolve-Path '.\portable022\ONCA-PDV-PRO-0.1.22-PEDIDOS-CREDIARIO-RELATORIOS.exe'
          1..5 | ForEach-Object {$p=Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru;if(-not $p.WaitForExit(30000)){try{$p.Kill($true)}catch{};throw "Smoke timeout $_"};if($p.ExitCode -ne 0){throw "Smoke failed $_"}}
      - name: SHA256
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: Get-FileHash '.\portable022\ONCA-PDV-PRO-0.1.22-PEDIDOS-CREDIARIO-RELATORIOS.exe' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.22-PEDIDOS-CREDIARIO-RELATORIOS
          path: work-final/ONCA-PDV-PRO/portable022/ONCA-PDV-PRO-0.1.22-PEDIDOS-CREDIARIO-RELATORIOS.exe
          retention-days: 14
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset='.\work-final\ONCA-PDV-PRO\portable022\ONCA-PDV-PRO-0.1.22-PEDIDOS-CREDIARIO-RELATORIOS.exe'
          gh release delete 'v0.1.22' --yes 2>$null
          gh release create 'v0.1.22' $asset --title 'ONÇA PDV PRO 0.1.22' --notes 'Pedidos aguardando pagamento; melhorias de crediário; relatórios; ajuste automático de tela; versão discreta; corte no final do cupom. Base física 0.1.21 preservada.'
