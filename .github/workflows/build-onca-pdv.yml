name: Build ONCA PDV PRO 0.1.12

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ONCA PDV source
        shell: pwsh
        run: |
          $zip = ".\ONCA-PDV-PRO-ATUALIZADO-0.1.3.zip"
          if (-not (Test-Path $zip)) { throw "ZIP do projeto nao encontrado." }
          if (Test-Path ".\work") { Remove-Item ".\work" -Recurse -Force }
          New-Item -ItemType Directory -Path ".\work" | Out-Null
          Expand-Archive -Path $zip -DestinationPath ".\work" -Force
          if (-not (Test-Path ".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj")) {
            throw "Projeto Desktop nao encontrado dentro do ZIP."
          }

      - name: Apply incremental 0.1.12 patch
        shell: pwsh
        run: |
          $encoded = (Get-Content ".\patches\onca-runtime-0.1.12.patch.gz.b64" -Raw) -replace "\s", ""
          $gzPath = Join-Path $PWD "onca-runtime-0.1.12.patch.gz"
          $patchPath = Join-Path $PWD "onca-runtime-0.1.12.patch"
          [IO.File]::WriteAllBytes($gzPath, [Convert]::FromBase64String($encoded))
          $hash = (Get-FileHash $gzPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "ee2c660ae05cac5165fbc6542d38eab7565e64f5234271f821e607af6f81bd03") {
            throw "Hash do patch 0.1.12 invalido: $hash"
          }
          $input = [IO.File]::OpenRead($gzPath)
          $output = [IO.File]::Create($patchPath)
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          try { $gzip.CopyTo($output) } finally { $gzip.Dispose(); $output.Dispose(); $input.Dispose() }
          Push-Location ".\work\ONCA-PDV-PRO"
          try {
            git init | Out-Null
            git apply --check $patchPath
            if ($LASTEXITCODE -ne 0) { throw "Patch 0.1.12 nao aplica limpo." }
            git apply $patchPath
            if ($LASTEXITCODE -ne 0) { throw "Falha ao aplicar patch 0.1.12." }
          } finally {
            Pop-Location
          }

      - name: Include new 0.1.12 desktop windows
        shell: pwsh
        run: |
          $src = ".\\patches\\0.1.12"
          $dst = ".\\work\\ONCA-PDV-PRO\\src\\OncaPDV.Desktop"
          $files = @(
            "ProductSelectionWindow.xaml",
            "ProductSelectionWindow.xaml.cs",
            "DiversosWindow.xaml",
            "DiversosWindow.xaml.cs"
          )
          foreach ($name in $files) {
            $source = Join-Path $src $name
            $target = Join-Path $dst $name
            if (-not (Test-Path $source)) { throw "Arquivo 0.1.12 ausente: $name" }
            Copy-Item $source $target -Force
          }

      - name: Align migration version regression test
        shell: pwsh
        run: |
          $test = ".\\work\\ONCA-PDV-PRO\\tests\\OncaPDV.Tests\\BusinessModuleTests.cs"
          $text = Get-Content $test -Raw
          $old = 'Assert.Equal(3,await e.Decimal("SELECT MAX(version) FROM schema_versions"))'
          $new = 'Assert.Equal(4,await e.Decimal("SELECT MAX(version) FROM schema_versions"))'
          if (-not $text.Contains($old)) { throw "Expected migration assertion was not found." }
          Set-Content $test ($text.Replace($old, $new)) -Encoding UTF8

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config

      - name: Test focused suite
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Restore Desktop
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -r win-x64 --configfile .\NuGet.Config

      - name: Build Desktop Release
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained win-x64
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          if (Test-Path .\publish) { Remove-Item .\publish -Recurse -Force }
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\publish
          if (-not (Test-Path .\publish\OncaPDV.Desktop.exe)) { throw "OncaPDV.Desktop.exe nao foi gerado." }
          Copy-Item .\publish\OncaPDV.Desktop.exe .\publish\ONCA-PDV-PRO-0.1.12-DIRETO.exe -Force
          $hash = (Get-FileHash .\publish\ONCA-PDV-PRO-0.1.12-DIRETO.exe -Algorithm SHA256).Hash
          "$hash  ONCA-PDV-PRO-0.1.12-DIRETO.exe" | Set-Content .\publish\ONCA-PDV-PRO-0.1.12-DIRETO.exe.sha256 -Encoding ascii
          Write-Host "EXE SHA256=$hash"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 nao encontrado." }
          & $iscc .\installer\ONCA-PDV-PRO.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar instalador." }
          $setup = ".\installer\Output\ONCA-PDV-PRO-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Instalador nao foi gerado." }
          Copy-Item $setup ".\installer\Output\ONCA-PDV-PRO-Setup-0.1.12.exe" -Force
          $hash = (Get-FileHash ".\installer\Output\ONCA-PDV-PRO-Setup-0.1.12.exe" -Algorithm SHA256).Hash
          "$hash  ONCA-PDV-PRO-Setup-0.1.12.exe" | Set-Content ".\installer\Output\ONCA-PDV-PRO-Setup-0.1.12.exe.sha256" -Encoding ascii
          Write-Host "SETUP SHA256=$hash"

      - name: Upload final Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.12-Windows
          if-no-files-found: error
          retention-days: 7
          path: |
            work/ONCA-PDV-PRO/publish/ONCA-PDV-PRO-0.1.12-DIRETO.exe
            work/ONCA-PDV-PRO/publish/ONCA-PDV-PRO-0.1.12-DIRETO.exe.sha256
            work/ONCA-PDV-PRO/installer/Output/ONCA-PDV-PRO-Setup-0.1.12.exe
            work/ONCA-PDV-PRO/installer/Output/ONCA-PDV-PRO-Setup-0.1.12.exe.sha256
