name: Build ONCA PDV PRO 0.1.12

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ONCA PDV source
        shell: pwsh
        run: |
          $zip = ".\ONCA-PDV-PRO-ATUALIZADO-0.1.3.zip"
          if (-not (Test-Path $zip)) { throw "ZIP do projeto nao encontrado." }
          if (Test-Path ".\work") { Remove-Item ".\work" -Recurse -Force }
          New-Item -ItemType Directory -Path ".\work" | Out-Null
          Expand-Archive -Path $zip -DestinationPath ".\work" -Force
          if (-not (Test-Path ".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj")) {
            throw "Projeto Desktop nao encontrado dentro do ZIP."
          }

      - name: Apply incremental 0.1.12 patch
        shell: pwsh
        run: |
          $encoded = (Get-Content ".\patches\onca-runtime-0.1.12.patch.gz.b64" -Raw) -replace "\s", ""
          $gzPath = Join-Path $PWD "onca-runtime-0.1.12.patch.gz"
          $patchPath = Join-Path $PWD "onca-runtime-0.1.12.patch"
          [IO.File]::WriteAllBytes($gzPath, [Convert]::FromBase64String($encoded))
          $hash = (Get-FileHash $gzPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "ee2c660ae05cac5165fbc6542d38eab7565e64f5234271f821e607af6f81bd03") {
            throw "Hash do patch 0.1.12 invalido: $hash"
          }
          $input = [IO.File]::OpenRead($gzPath)
          $output = [IO.File]::Create($patchPath)
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          try { $gzip.CopyTo($output) } finally { $gzip.Dispose(); $output.Dispose(); $input.Dispose() }
          Push-Location ".\work\ONCA-PDV-PRO"
          try {
            git init | Out-Null
            git apply --check $patchPath
            if ($LASTEXITCODE -ne 0) { throw "Patch 0.1.12 nao aplica limpo." }
            git apply $patchPath
            if ($LASTEXITCODE -ne 0) { throw "Falha ao aplicar patch 0.1.12." }
          } finally {
            Pop-Location
          }

      - name: Include new 0.1.12 desktop windows
        shell: pwsh
        run: |
          $src = ".\\patches\\0.1.12"
          $dst = ".\\work\\ONCA-PDV-PRO\\src\\OncaPDV.Desktop"
          $files = @(
            "ProductSelectionWindow.xaml",
            "ProductSelectionWindow.xaml.cs",
            "DiversosWindow.xaml",
            "DiversosWindow.xaml.cs"
          )
          foreach ($name in $files) {
            $source = Join-Path $src $name
            $target = Join-Path $dst $name
            if (-not (Test-Path $source)) { throw "Arquivo 0.1.12 ausente: $name" }
            Copy-Item $source $target -Force
          }
          $installerSource = Join-Path $src "ONCA-PDV-PRO.iss"
          $installerTarget = ".\\work\\ONCA-PDV-PRO\\installer\\ONCA-PDV-PRO.iss"
          if (-not (Test-Path $installerSource)) { throw "Instalador padrao 0.1.12 ausente." }
          Copy-Item $installerSource $installerTarget -Force

      - name: Align migration version regression test
        shell: pwsh
        run: |
          $test = ".\\work\\ONCA-PDV-PRO\\tests\\OncaPDV.Tests\\BusinessModuleTests.cs"
          $text = Get-Content $test -Raw
          $old = 'Assert.Equal(3,await e.Decimal("SELECT MAX(version) FROM schema_versions"))'
          $new = 'Assert.Equal(4,await e.Decimal("SELECT MAX(version) FROM schema_versions"))'
          if (-not $text.Contains($old)) { throw "Expected migration assertion was not found." }
          Set-Content $test ($text.Replace($old, $new)) -Encoding UTF8

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config

      - name: Test focused suite
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Restore Desktop
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -r win-x64 --configfile .\NuGet.Config

      - name: Build Desktop Release
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained win-x64
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          if (Test-Path .\publish) { Remove-Item .\publish -Recurse -Force }
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\publish
          if (-not (Test-Path .\publish\OncaPDV.Desktop.exe)) { throw "OncaPDV.Desktop.exe nao foi gerado." }
          Copy-Item .\publish\OncaPDV.Desktop.exe .\publish\ONCA-PDV-PRO-0.1.12-DIRETO.exe -Force
          $hash = (Get-FileHash .\publish\ONCA-PDV-PRO-0.1.12-DIRETO.exe -Algorithm SHA256).Hash
          "$hash  ONCA-PDV-PRO-0.1.12-DIRETO.exe" | Set-Content .\publish\ONCA-PDV-PRO-0.1.12-DIRETO.exe.sha256 -Encoding ascii
          Write-Host "EXE SHA256=$hash"

      - name: Build direct updater EXE
        shell: pwsh
        working-directory: .\\work\\ONCA-PDV-PRO
        run: |
          $payloadRoot = ".\\updater-payload"
          if (Test-Path $payloadRoot) { Remove-Item $payloadRoot -Recurse -Force }
          $pkg = Join-Path $payloadRoot "ONCA-PDV-PRO"
          $payload = Join-Path $pkg "payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          Copy-Item ".\\publish\\OncaPDV.Desktop.exe" (Join-Path $payload "OncaPDV.Desktop.exe") -Force
          if (Test-Path ".\\publish\\appsettings.json") {
            Copy-Item ".\\publish\\appsettings.json" (Join-Path $payload "appsettings.json") -Force
          }
          Copy-Item "..\\..\\patches\\0.1.12\\ATUALIZAR-ONCA-PDV-0.1.12.ps1" (Join-Path $pkg "ATUALIZAR-ONCA-PDV-0.1.12.ps1") -Force

          $zip = ".\\updater-payload.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $payloadRoot "*") -DestinationPath $zip -CompressionLevel Optimal

          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ Build Tools nao encontrado." }
          $vcvars = Join-Path $vs "VC\\Auxiliary\\Build\\vcvars64.bat"
          $launcher = Resolve-Path "..\\..\\patches\\0.1.12\\updater-launcher.c"
          $stub = Join-Path $PWD "updater-stub.exe"
          $cmd = "`"$vcvars`" >nul && cl.exe /nologo /O2 /MT /DUNICODE /D_UNICODE `"$launcher`" /Fe:`"$stub`" shell32.lib user32.lib /link /SUBSYSTEM:WINDOWS"
          cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $stub)) { throw "Falha ao compilar launcher nativo." }

          $outDir = ".\\installer\\Output"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $updater = Join-Path $outDir "ONCA-PDV-PRO-ATUALIZAR-0.1.12.exe"

          $stubBytes = [IO.File]::ReadAllBytes($stub)
          $zipBytes = [IO.File]::ReadAllBytes((Resolve-Path $zip))
          $lenBytes = [BitConverter]::GetBytes([Int64]$zipBytes.LongLength)
          $fs = [IO.File]::Create($updater)
          try {
            $fs.Write($stubBytes,0,$stubBytes.Length)
            $fs.Write($zipBytes,0,$zipBytes.Length)
            $fs.Write($lenBytes,0,$lenBytes.Length)
          } finally { $fs.Dispose() }

          $hash = (Get-FileHash $updater -Algorithm SHA256).Hash
          "$hash  ONCA-PDV-PRO-ATUALIZAR-0.1.12.exe" | Set-Content "$updater.sha256" -Encoding ascii
          Write-Host "UPDATER SHA256=$hash"

      - name: Smoke test direct updater
        shell: pwsh
        working-directory: .\\work\\ONCA-PDV-PRO
        run: |
          $updater = Resolve-Path ".\\installer\\Output\\ONCA-PDV-PRO-ATUALIZAR-0.1.12.exe"
          $smoke = Join-Path $env:RUNNER_TEMP "onca-pdv-updater-smoke"
          if (Test-Path $smoke) { Remove-Item $smoke -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null

          $env:ONCA_TEST_INSTALL_DIR = $smoke
          try {
            $p = Start-Process -FilePath $updater -ArgumentList "--test" -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Atualizador retornou codigo $($p.ExitCode)." }
          } finally {
            Remove-Item Env:ONCA_TEST_INSTALL_DIR -ErrorAction SilentlyContinue
          }

          $installed = Join-Path $smoke "OncaPDV.Desktop.exe"
          if (-not (Test-Path $installed)) { throw "Atualizador nao instalou o EXE no teste." }

          $expected = (Get-FileHash ".\\publish\\OncaPDV.Desktop.exe" -Algorithm SHA256).Hash
          $actual = (Get-FileHash $installed -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "Hash do EXE instalado difere do publicado." }
          Write-Host "DIRECT UPDATER SMOKE OK"

      - name: Upload final Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.12-Windows
          if-no-files-found: error
          retention-days: 7
          path: |
            work/ONCA-PDV-PRO/publish/ONCA-PDV-PRO-0.1.12-DIRETO.exe
            work/ONCA-PDV-PRO/publish/ONCA-PDV-PRO-0.1.12-DIRETO.exe.sha256
            work/ONCA-PDV-PRO/installer/Output/ONCA-PDV-PRO-ATUALIZAR-0.1.12.exe
            work/ONCA-PDV-PRO/installer/Output/ONCA-PDV-PRO-ATUALIZAR-0.1.12.exe.sha256
