name: Build ONCA PDV PRO 0.1.3

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source bundle
        shell: pwsh
        run: |
          if (Test-Path .\ci\source.part01) {
            $parts = Get-ChildItem .\ci\source.part* | Sort-Object Name
            $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
            [IO.File]::WriteAllBytes((Join-Path $PWD 'source.tar.gz'), [Convert]::FromBase64String($base64))
            tar -xzf .\source.tar.gz
            Remove-Item .\source.tar.gz -Force
          }
          if (-not (Test-Path .\OncaPDV.slnx)) { throw "Fonte do ONCA PDV nao foi reconstruida." }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        shell: pwsh
        run: dotnet restore .\OncaPDV.slnx --configfile .\NuGet.Config

      - name: Test
        shell: pwsh
        run: dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Build Release
        shell: pwsh
        run: dotnet build .\OncaPDV.slnx -c Release --no-restore

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          if (Test-Path .\publish) { Remove-Item .\publish -Recurse -Force }
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\publish
          if (-not (Test-Path .\publish\OncaPDV.Desktop.exe)) { throw "OncaPDV.Desktop.exe nao foi gerado." }
          $hash = (Get-FileHash .\publish\OncaPDV.Desktop.exe -Algorithm SHA256).Hash
          "$hash  OncaPDV.Desktop.exe" | Set-Content .\publish\OncaPDV.Desktop.exe.sha256 -Encoding ascii
          Write-Host "EXE SHA256=$hash"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 nao encontrado." }
          & $iscc .\installer\ONCA-PDV-PRO.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar instalador." }
          $setup = ".\installer\Output\ONCA-PDV-PRO-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Instalador nao foi gerado." }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "$hash  ONCA-PDV-PRO-Setup.exe" | Set-Content "$setup.sha256" -Encoding ascii
          Write-Host "SETUP SHA256=$hash"

      - name: Upload final Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.3-Windows
          if-no-files-found: error
          retention-days: 7
          path: |
            publish/**
            installer/Output/ONCA-PDV-PRO-Setup.exe
            installer/Output/ONCA-PDV-PRO-Setup.exe.sha256
