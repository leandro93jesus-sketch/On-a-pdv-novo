name: Build ONCA PDV PRO 0.1.11 QUICKFIX

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ONCA PDV source
        shell: pwsh
        run: |
          $zip = ".\ONCA-PDV-PRO-ATUALIZADO-0.1.3.zip"
          if (-not (Test-Path $zip)) { throw "ZIP do projeto nao encontrado." }
          if (Test-Path ".\work") { Remove-Item ".\work" -Recurse -Force }
          New-Item -ItemType Directory -Path ".\work" | Out-Null
          Expand-Archive -Path $zip -DestinationPath ".\work" -Force
          if (-not (Test-Path ".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj")) {
            throw "Projeto Desktop nao encontrado dentro do ZIP."
          }

      - name: Apply ONCA PDV 0.1.11 quick fixes
        shell: pwsh
        run: .\ci\apply-quickfix-018.ps1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Desktop
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -r win-x64 --configfile .\NuGet.Config

      - name: Build Desktop Release
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained win-x64
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          if (Test-Path .\publish) { Remove-Item .\publish -Recurse -Force }
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\publish
          if (-not (Test-Path .\publish\OncaPDV.Desktop.exe)) { throw "OncaPDV.Desktop.exe nao foi gerado." }
          $hash = (Get-FileHash .\publish\OncaPDV.Desktop.exe -Algorithm SHA256).Hash
          "$hash  OncaPDV.Desktop.exe" | Set-Content .\publish\OncaPDV.Desktop.exe.sha256 -Encoding ascii
          Write-Host "EXE SHA256=$hash"

      - name: Upload final Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.11-DIRECT-EXE
          if-no-files-found: error
          retention-days: 7
          path: |
            work/ONCA-PDV-PRO/publish/**
