name: Build ONCA PDV PRO 0.1.4

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source and apply 0.1.4 patch
        shell: pwsh
        run: |
          $zip = ".\ONCA-PDV-PRO-ATUALIZADO-0.1.3.zip"
          if (-not (Test-Path $zip)) { throw "ZIP base 0.1.3 nao encontrado." }

          if (Test-Path ".\work") { Remove-Item ".\work" -Recurse -Force }
          New-Item -ItemType Directory -Path ".\work" | Out-Null
          Expand-Archive -Path $zip -DestinationPath ".\work" -Force

          $project = ".\work\ONCA-PDV-PRO"
          if (-not (Test-Path "$project\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj")) {
            throw "Projeto Desktop nao encontrado no ZIP."
          }

          $parts = Get-ChildItem ".\patches\0.1.4\part*.b64" | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Patch incompleto: esperadas 4 partes." }

          $base64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          $gzipBytes = [Convert]::FromBase64String($base64)

          $inStream = New-Object IO.MemoryStream(,$gzipBytes)
          $gzip = New-Object IO.Compression.GZipStream($inStream, [IO.Compression.CompressionMode]::Decompress)
          $outPath = Join-Path $PWD "update-0.1.4.patch"
          $outStream = [IO.File]::Create($outPath)
          $gzip.CopyTo($outStream)
          $outStream.Dispose()
          $gzip.Dispose()
          $inStream.Dispose()

          Push-Location $project
          git init -q
          git apply --check "$env:GITHUB_WORKSPACE\update-0.1.4.patch"
          git apply --whitespace=nowarn "$env:GITHUB_WORKSPACE\update-0.1.4.patch"
          git apply --check "$env:GITHUB_WORKSPACE\patches\0.1.4\hotfix-raw-strings.patch"
          git apply --whitespace=nowarn "$env:GITHUB_WORKSPACE\patches\0.1.4\hotfix-raw-strings.patch"
          git apply --check "$env:GITHUB_WORKSPACE\patches\0.1.4\hotfix-raw-indent.patch"
          git apply --whitespace=nowarn "$env:GITHUB_WORKSPACE\patches\0.1.4\hotfix-raw-indent.patch"
          git apply --check "$env:GITHUB_WORKSPACE\patches\0.1.4\hotfix-receipt-compat.patch"
          git apply --whitespace=nowarn "$env:GITHUB_WORKSPACE\patches\0.1.4\hotfix-receipt-compat.patch"
          Pop-Location

          $csproj = Get-Content "$project\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj" -Raw
          if ($csproj -notmatch '<Version>0\.1\.4</Version>') { throw "Versao 0.1.4 nao aplicada." }
          Write-Host "Patch 0.1.4 aplicado com sucesso."

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config

      - name: Run all tests
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Restore Desktop
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -r win-x64 --configfile .\NuGet.Config

      - name: Build Desktop Release
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained win-x64
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          if (Test-Path .\publish) { Remove-Item .\publish -Recurse -Force }
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\publish
          if (-not (Test-Path .\publish\OncaPDV.Desktop.exe)) { throw "OncaPDV.Desktop.exe nao foi gerado." }
          $hash = (Get-FileHash .\publish\OncaPDV.Desktop.exe -Algorithm SHA256).Hash
          "$hash  OncaPDV.Desktop.exe" | Set-Content .\publish\OncaPDV.Desktop.exe.sha256 -Encoding ascii
          Write-Host "EXE SHA256=$hash"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 nao encontrado." }

          & $iscc .\installer\ONCA-PDV-PRO.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar instalador." }

          $setup = ".\installer\Output\ONCA-PDV-PRO-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Instalador nao foi gerado." }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "$hash  ONCA-PDV-PRO-Setup.exe" | Set-Content "$setup.sha256" -Encoding ascii
          Write-Host "SETUP SHA256=$hash"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.4-EXE
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          path: |
            work/ONCA-PDV-PRO/publish/OncaPDV.Desktop.exe
            work/ONCA-PDV-PRO/publish/OncaPDV.Desktop.exe.sha256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.4-SETUP
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          path: |
            work/ONCA-PDV-PRO/installer/Output/ONCA-PDV-PRO-Setup.exe
            work/ONCA-PDV-PRO/installer/Output/ONCA-PDV-PRO-Setup.exe.sha256
