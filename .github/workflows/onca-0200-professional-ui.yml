name: ONCA 0.2.0 professional UI Windows verified
on:
  push:
    branches: [feature/pro-ui-0200]
    paths:
      - '.github/workflows/onca-0200-professional-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build-and-release:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 0.1.53 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item input -ItemType Directory -Force | Out-Null
          gh release download v0.1.53-crediario-lista-ativa --repo leandro93jesus-sketch/On-a-pdv-novo --pattern 'ONCA-PDV-PRO-0.1.53-CODIGO-FONTE.zip' --dir input --clobber
          if($LASTEXITCODE -ne 0){throw 'Could not download exact 0.1.53 source'}
          Expand-Archive (Resolve-Path 'input/ONCA-PDV-PRO-0.1.53-CODIGO-FONTE.zip').Path source -Force

      - name: Freeze printing baseline before UI patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'src/OncaPDV.Printing/OncaPDV.Printing.csproj',
            'src/OncaPDV.Printing/PrinterDiscovery.cs',
            'src/OncaPDV.Printing/Printing.cs',
            'src/OncaPDV.Desktop/ConfiguredPhysicalPrintService.cs',
            'src/OncaPDV.Desktop/PrinterSettingsWindow.xaml',
            'src/OncaPDV.Desktop/PrinterSettingsWindow.xaml.cs',
            'src/OncaPDV.Desktop/ReceiptPreviewWindow.xaml',
            'src/OncaPDV.Desktop/ReceiptPreviewWindow.xaml.cs',
            'src/OncaPDV.Desktop/MainWindow.xaml.cs',
            'src/OncaPDV.Desktop/PaymentWindow.xaml',
            'src/OncaPDV.Desktop/PaymentWindow.xaml.cs'
          )
          $rows=@()
          foreach($f in $files){
            $p=Join-Path source $f
            if(-not (Test-Path $p)){throw "Frozen printing file missing: $f"}
            $rows += [pscustomobject]@{File=$f;Sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $rows | ConvertTo-Json | Set-Content printing-baseline.json -Encoding UTF8
          $known=@{
            'src/OncaPDV.Printing/OncaPDV.Printing.csproj'='e7913d793f45d94022bbeca97ca5642b978cd3fd323b007549a060c0bffe181e';
            'src/OncaPDV.Printing/PrinterDiscovery.cs'='45ca6253be689d76fb08714e5c84794426ed75cee62a46eb94b92a2a11146974';
            'src/OncaPDV.Printing/Printing.cs'='31efe29ba9ad4ec1045f65743ebdb810e0f4eb91057d8785ffba6f59975607c4';
            'src/OncaPDV.Desktop/ConfiguredPhysicalPrintService.cs'='f770c30860d7acfcc889151e58871f1ee067a948721df9ec551539c9bafd8de5';
            'src/OncaPDV.Desktop/PrinterSettingsWindow.xaml'='1f33cdf3accda854b3bf6c989416a64772611c3da1deda4815a6ff4e7fdd9faf';
            'src/OncaPDV.Desktop/PrinterSettingsWindow.xaml.cs'='c99b8b6b15e1e2e8db73118826a17552ca9aa5ea6979a0edb8d2f3f2577dedbb';
            'src/OncaPDV.Desktop/ReceiptPreviewWindow.xaml'='c8b26d4aa945ecb5c8ccdaa051f9a8e649e9734b19b64d82faf69b3b278c796b';
            'src/OncaPDV.Desktop/ReceiptPreviewWindow.xaml.cs'='d41a006fe0225001c92e2aff62b6e1ed82fed76c41c831c9870e64d0c2dc67b2';
            'src/OncaPDV.Desktop/MainWindow.xaml.cs'='fd63076c1892cfb8439317460607aa1b2f00d17ac17ec4672d213c9e3c0fbffe';
            'src/OncaPDV.Desktop/PaymentWindow.xaml'='5d311ee2d20629814abcbb7c063ce68d464bfdc30862cfe4410b119ced39a6bc';
            'src/OncaPDV.Desktop/PaymentWindow.xaml.cs'='52c5ca6cc63df6827e4cf68b8294715eccaca72de39ad46bf89d17fee995d1fd'
          }
          foreach($row in $rows){if($known[$row.File] -ne $row.Sha){throw "0.1.53 printing baseline mismatch: $($row.File)"}}
          Write-Host 'PRINTING_BASELINE_0153_CONFIRMED=YES'

      - name: Apply reviewed 0.2.0 UI patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -c "import base64,gzip,pathlib; p=pathlib.Path('patches/onca-0200-from-0153.patch.gz.b64'); pathlib.Path('onca0200.patch').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))"
          if($LASTEXITCODE -ne 0){throw 'Patch unpack failed'}
          $patch=(Resolve-Path onca0200.patch).Path
          $hash=(Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SOURCE_PATCH_SHA256=$hash"
          if($hash -ne '8c020d35f2d099290887b825c64fbefc76b340da473be62763a28979737cb41d'){throw 'Patch SHA256 mismatch'}
          git apply --check --directory=source --whitespace=nowarn $patch
          if($LASTEXITCODE -ne 0){throw 'Patch incompatible with 0.1.53 source'}
          git apply --directory=source --whitespace=nowarn $patch
          if($LASTEXITCODE -ne 0){throw 'Patch apply failed'}
          Write-Host 'EXACT_0200_PATCH_APPLIED=YES'

      - name: Prove printing remained byte-identical
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $baseline=Get-Content printing-baseline.json -Raw | ConvertFrom-Json
          foreach($row in $baseline){
            $p=Join-Path source $row.File
            $after=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($after -ne $row.Sha){throw "PRINTING FREEZE VIOLATION: $($row.File)"}
          }
          Write-Host 'PRINTING_FREEZE_0200=PASS'

      - name: Validate professional XAML structure
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'src/OncaPDV.Desktop/ProfessionalTheme0200.xaml',
            'src/OncaPDV.Desktop/MainWindow.xaml',
            'src/OncaPDV.Desktop/CreditWindow.xaml',
            'src/OncaPDV.Desktop/Finance052Window.xaml',
            'src/OncaPDV.Desktop/IntegrityCenter151Window.xaml'
          )
          foreach($f in $files){
            try{[xml](Get-Content $f -Raw) | Out-Null}catch{throw "Invalid XAML XML: $f :: $($_.Exception.Message)"}
          }
          $main=Get-Content 'src/OncaPDV.Desktop/MainWindow.xaml' -Raw
          foreach($n in @('SearchBox','CartGrid','SalesGrid','TotalText','CustomerText','ClockText','DatabaseStatus','LastBackupText','RecoveryText','StatusText','DiversosNameBox','DiversosQtyBox','DiversosValueBox','MultiSaleTabsPanel')){
            if(-not $main.Contains('x:Name="'+$n+'"')){throw "MainWindow missing control $n"}
          }
          foreach($h in @('Add_Click','Pay_Click','PayCash_Click','PayPix_Click','PayDebit_Click','PayCredit_Click','PayStoreCredit_Click','Reprint_Click','SalePdf_Click','Printer_Click')){
            if(-not $main.Contains('Click="'+$h+'"')){throw "MainWindow missing handler $h"}
          }
          $credit=Get-Content 'src/OncaPDV.Desktop/CreditWindow.xaml' -Raw
          foreach($h in @('Receive_Click','EditReceipt_Click','ReverseReceipt_Click','DeleteCredit046_Click','CheckCreditCash046_Click')){
            $count=([regex]::Matches($credit,'Click="'+[regex]::Escape($h)+'"')).Count
            if($count -ne 1){throw "Crediario action $h expected once, got $count"}
          }
          if(-not $main.Contains('0.2.0') -or -not $credit.Contains('0.2.0')){throw '0.2.0 title missing'}
          Write-Host 'PRO_UI_STRUCTURE_0200=PASS'

      - name: Restore .NET dependencies
        shell: pwsh
        working-directory: source
        run: |
          dotnet restore tests/OncaPDV.Tests/OncaPDV.Tests.csproj --configfile NuGet.Config
          if($LASTEXITCODE -ne 0){throw 'NuGet restore failed'}

      - name: Full regression including printing isolation
        shell: pwsh
        working-directory: source
        run: |
          dotnet test tests/OncaPDV.Tests/OncaPDV.Tests.csproj -c Release --no-restore --logger 'console;verbosity=minimal' --results-directory test-results
          if($LASTEXITCODE -ne 0){throw 'Regression tests failed; no release'}

      - name: Build WPF with warnings as errors
        shell: pwsh
        working-directory: source
        run: |
          dotnet restore src/OncaPDV.Desktop/OncaPDV.Desktop.csproj --configfile NuGet.Config
          if($LASTEXITCODE -ne 0){throw 'Desktop restore failed'}
          dotnet build src/OncaPDV.Desktop/OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Desktop build failed; no release'}

      - name: Publish Windows folder and single EXE
        shell: pwsh
        working-directory: source
        run: |
          dotnet publish src/OncaPDV.Desktop/OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o package/ONCA-PDV-PRO-0.2.0-WIN64
          if($LASTEXITCODE -ne 0){throw 'Folder publish failed'}
          dotnet publish src/OncaPDV.Desktop/OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o package/single
          if($LASTEXITCODE -ne 0){throw 'Single EXE publish failed'}
          foreach($p in @('package/ONCA-PDV-PRO-0.2.0-WIN64/OncaPDV.Desktop.exe','package/single/OncaPDV.Desktop.exe')){
            if(-not (Test-Path $p)){throw "Missing EXE: $p"}
            $v=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $p).Path)
            Write-Host "$p : FileVersion=$($v.FileVersion) Product=$($v.ProductName)"
            if($v.FileVersion -ne '0.2.0.0'){throw 'Wrong version metadata'}
          }

      - name: Start both Windows builds with isolated databases
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          foreach($kind in @('ONCA-PDV-PRO-0.2.0-WIN64','single')){
            $exe=(Resolve-Path "package/$kind/OncaPDV.Desktop.exe").Path
            $env:ONCA_PDV_DATA_ROOT=Join-Path $env:RUNNER_TEMP ('onca0200-'+$kind+'-'+[Guid]::NewGuid().ToString('N'))
            New-Item $env:ONCA_PDV_DATA_ROOT -ItemType Directory -Force | Out-Null
            $start=Get-Date
            $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 10
            $p.Refresh()
            if($p.HasExited){throw "$kind crashed at startup. Exit: $($p.ExitCode)"}
            $db=Join-Path $env:ONCA_PDV_DATA_ROOT 'data/onca-pdv-pro.db'
            if(-not (Test-Path $db)){throw "$kind did not initialize isolated DB"}
            $p.CloseMainWindow()|Out-Null
            Start-Sleep -Seconds 2
            $p.Refresh()
            if(-not $p.HasExited){$p.Kill($true)}
            $errors=@(Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$start;Level=2} -ErrorAction SilentlyContinue | Where-Object {$_.Message -like '*ONCA-PDV*' -or $_.Message -like '*OncaPDV*'})
            if($errors.Count){throw "Application errors in $kind startup"}
            Write-Host "$kind : WINDOWS_STARTUP_AND_ISOLATED_DB=PASS"
          }

      - name: Package tested release
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          @'
          ONÇA PDV PRO 0.2.0 — INTERFACE PROFISSIONAL

          Esta versão reorganiza a interface e o fluxo operacional sobre a base 0.1.53.
          Impressão foi congelada: nenhuma lógica de impressão, preview, reimpressão ou pagamento foi alterada.

          Principais mudanças:
          - Frente de caixa com carrinho central e checkout persistente.
          - Navegação separada em Operação / Gestão / Sistema.
          - Crediário com uma única ação principal de receber e ações administrativas recolhidas.
          - Financeiro e Centro de Integridade reorganizados.
          - Tema visual consistente e profissional.

          Faça backup de %LOCALAPPDATA%\Onca PDV Pro antes de atualizar.
          Windows 10/11 x64. Sem assinatura digital.
          '@ | Set-Content package/ONCA-PDV-PRO-0.2.0-WIN64/LEIA-ME.txt -Encoding UTF8
          Compress-Archive -Path package/ONCA-PDV-PRO-0.2.0-WIN64 -DestinationPath ONCA-PDV-PRO-0.2.0-WINDOWS-PORTATIL.zip -CompressionLevel Optimal -Force
          Copy-Item package/single/OncaPDV.Desktop.exe ONCA-PDV-PRO-0.2.0-PROFISSIONAL.exe
          New-Item source-clean -ItemType Directory -Force|Out-Null
          foreach($dir in @('src','tests','docs')){Copy-Item $dir source-clean/$dir -Recurse -Force}
          foreach($file in @('NuGet.Config','OncaPDV.slnx','AI-HANDOFF.md','AI-HANDOFF-046.md','AI-HANDOFF-050.md','AI-HANDOFF-151.md','AI-HANDOFF-152.md','AI-HANDOFF-153.md','AI-HANDOFF-0200.md','README.md')){if(Test-Path $file){Copy-Item $file source-clean/$file -Force}}
          Get-ChildItem source-clean -Directory -Recurse | Where-Object {$_.Name -in @('bin','obj','TestResults','test-results','package')} | Sort-Object FullName -Descending | Remove-Item -Recurse -Force
          Get-ChildItem source-clean -File -Recurse | Where-Object {$_.Extension -in @('.exe','.db','.pdb')} | Remove-Item -Force
          Compress-Archive -Path source-clean/* -DestinationPath ONCA-PDV-PRO-0.2.0-CODIGO-FONTE.zip -CompressionLevel Optimal -Force
          Write-Host "DIRECT_EXE_SHA256=$((Get-FileHash ONCA-PDV-PRO-0.2.0-PROFISSIONAL.exe -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "FOLDER_ZIP_SHA256=$((Get-FileHash ONCA-PDV-PRO-0.2.0-WINDOWS-PORTATIL.zip -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "SOURCE_ZIP_SHA256=$((Get-FileHash ONCA-PDV-PRO-0.2.0-CODIGO-FONTE.zip -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.2.0-PROFISSIONAL
          path: |
            source/ONCA-PDV-PRO-0.2.0-PROFISSIONAL.exe
            source/ONCA-PDV-PRO-0.2.0-WINDOWS-PORTATIL.zip
            source/ONCA-PDV-PRO-0.2.0-CODIGO-FONTE.zip
          retention-days: 30

      - name: Publish tested 0.2.0 release
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0-profissional ONCA-PDV-PRO-0.2.0-PROFISSIONAL.exe ONCA-PDV-PRO-0.2.0-WINDOWS-PORTATIL.zip ONCA-PDV-PRO-0.2.0-CODIGO-FONTE.zip --repo leandro93jesus-sketch/On-a-pdv-novo --target ${{ github.sha }} --title "ONCA PDV PRO 0.2.0 - INTERFACE PROFISSIONAL" --notes "Redesign profissional sobre a base 0.1.53: checkout, crediario, financeiro e Centro de Integridade reorganizados. Impressao, preview, reimpressao e PaymentWindow permaneceram byte-identicos e o pipeline bloqueia qualquer alteracao nesses arquivos. Regressao completa, build WPF e smoke Windows em dois formatos. Faça backup antes de atualizar."
          if($LASTEXITCODE -ne 0){throw 'Release creation failed'}
          gh release view v0.2.0-profissional --repo leandro93jesus-sketch/On-a-pdv-novo --json url,assets
