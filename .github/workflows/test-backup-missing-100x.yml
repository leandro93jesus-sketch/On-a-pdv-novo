name: Test backup missing isolated 100x
on:
  push:
    paths:
      - '.github/workflows/test-backup-missing-100x.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild approved base
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\work" -Force | Out-Null
          Expand-Archive ".\ONCA-PDV-PRO-ATUALIZADO-0.1.3.zip" ".\work" -Force
          $encoded=(Get-Content ".\patches\onca-0111-melhorias-hoje.patch.gz.b64" -Raw) -replace "\s",""
          [IO.File]::WriteAllBytes(".\base.gz",[Convert]::FromBase64String($encoded))
          $i=[IO.File]::OpenRead(".\base.gz");$o=[IO.File]::Create(".\base.patch");$g=[IO.Compression.GzipStream]::new($i,[IO.Compression.CompressionMode]::Decompress)
          try{$g.CopyTo($o)}finally{$g.Dispose();$o.Dispose();$i.Dispose()}
          Push-Location ".\work\ONCA-PDV-PRO"; git init | Out-Null; git apply "..\..\base.patch"; if($LASTEXITCODE -ne 0){throw "Base patch failed"}; Pop-Location
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build tests
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet build .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore
      - name: Corrupt backup scenarios isolated 100x
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          for($i=1;$i -le 100;$i++){
            Write-Host "===== ISOLATED BACKUP CYCLE $i / 100 ====="
            dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~Corrupt_backup_cancels_restore_and_preserves_current_database" --logger "console;verbosity=minimal"
            if($LASTEXITCODE -ne 0){throw "Backup isolated stress failed at $i"}
          }
