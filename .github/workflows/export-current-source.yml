name: Export current ONCA PDV source

on:
  push:
    branches:
      - dev/onca-pdv-0.1.5
    paths:
      - EXPORT-SOURCE-TRIGGER.txt

permissions:
  contents: write

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/onca-pdv-0.1.5
          fetch-depth: 0

      - name: Rebuild current 0.1.4 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work current
          mkdir -p work
          unzip -q ONCA-PDV-PRO-ATUALIZADO-0.1.3.zip -d work
          project="work/ONCA-PDV-PRO"
          test -f "$project/src/OncaPDV.Desktop/OncaPDV.Desktop.csproj"

          base64 -d < <(cat patches/0.1.4/part00.b64 patches/0.1.4/part01.b64 patches/0.1.4/part02.b64 patches/0.1.4/part03.b64) | gzip -d > update-0.1.4.patch

          cd "$project"
          git init -q
          git apply --check "$GITHUB_WORKSPACE/update-0.1.4.patch"
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/update-0.1.4.patch"
          git apply --check "$GITHUB_WORKSPACE/patches/0.1.4/hotfix-raw-strings.patch"
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/0.1.4/hotfix-raw-strings.patch"
          git apply --check "$GITHUB_WORKSPACE/patches/0.1.4/hotfix-raw-indent.patch"
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/0.1.4/hotfix-raw-indent.patch"
          git apply --check "$GITHUB_WORKSPACE/patches/0.1.4/hotfix-receipt-compat.patch"
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/0.1.4/hotfix-receipt-compat.patch"
          cd "$GITHUB_WORKSPACE"

          mkdir current
          rsync -a --exclude bin --exclude obj --exclude publish --exclude installer/Output --exclude '.git' "$project/" current/
          rm -f update-0.1.4.patch

      - name: Commit exported current source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add current
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Export current ONCA PDV 0.1.4 source [skip ci]"
            git push origin HEAD:dev/onca-pdv-0.1.5
          fi
