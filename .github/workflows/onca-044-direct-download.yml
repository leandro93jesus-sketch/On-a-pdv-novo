name: Direct EXE ONCA 0.1.44 Sales Integrity
on:
  push:
    paths:
      - '.github/workflows/onca-044-direct-download.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release-exe:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.44-VENDAS-CORRIGIDAS.exe
          run-id: 36476651060
          github-token: ${{ github.token }}
          path: release-files
      - name: Publish exact tested executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $asset=Join-Path (Resolve-Path 'release-files').Path 'ONCA-PDV-PRO-0.1.44-VENDAS-CORRIGIDAS.exe'
          if(-not (Test-Path $asset)){throw 'EXE not found'}
          if((Get-Item $asset).Length -lt 100MB){throw 'Unexpectedly small EXE'}
          $fs=[System.IO.File]::OpenRead($asset)
          try{if($fs.ReadByte() -ne 77 -or $fs.ReadByte() -ne 90){throw 'Not an EXE'}}finally{$fs.Dispose()}
          $sha=(Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "EXE_SHA256=$sha"
          gh release create v0.1.44-vendas-corrigidas $asset --repo leandro93jesus-sketch/On-a-pdv-novo --target 0519a0cd2fb5d6daae3b1b1626fd4dc9e1332040 --title 'ONCA PDV PRO 0.1.44 - VENDAS CORRIGIDAS' --notes 'EXE portatil Windows x64, sem instalador. Corrige venda duplicada por retentativa e falha na limpeza do carrinho, com identidade persistente no banco e nas abas multivendas. Adiciona EXCLUIR VENDA: autorizacao por PIN administrativo, motivo, estorno unico, exclusao logica e auditoria (filtro Excluidas). Não exclui vendas antigas automaticamente. 140 testes aprovados, testes GUI de cancelamento, exclusao, abertura e recuperacao de abas. Faça backup antes de testar na loja e mantenha a versao 0.1.43 como retorno.'
          if($LASTEXITCODE -ne 0){throw "Release publish failed: $LASTEXITCODE"}
          gh release view v0.1.44-vendas-corrigidas --repo leandro93jesus-sketch/On-a-pdv-novo --json assets,url
          if($LASTEXITCODE -ne 0){throw "Release verification failed: $LASTEXITCODE"}
