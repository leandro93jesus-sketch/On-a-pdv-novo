name: DEBUG PRINTING 020
on:
  push:
    paths:
      - '.github/workflows/debug-printing-020.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          .\scripts\rebuild-onca-016-final.ps1
          python .\scripts\apply_ui_018.py
          python .\scripts\apply_ui_019.py
          python .\scripts\apply_ui_020.py
          $root='.\work-final\ONCA-PDV-PRO'
          Write-Host '=== PRINTING FILES ==='
          Get-ChildItem "$root\src\OncaPDV.Printing" -File | ForEach-Object { Write-Host "===FILE:$($_.Name)==="; Get-Content $_.FullName }
          Write-Host '=== PRINTER SETTINGS ==='
          Get-Content "$root\src\OncaPDV.Desktop\PrinterSettingsWindow.xaml"
          Get-Content "$root\src\OncaPDV.Desktop\PrinterSettingsWindow.xaml.cs"
