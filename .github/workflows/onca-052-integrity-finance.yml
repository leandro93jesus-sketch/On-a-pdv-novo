name: ONCA 0.1.52 integrity finance Windows verified
on:
  push:
    branches: [feature/integrity-finance-052]
    paths:
      - '.github/workflows/onca-052-integrity-finance.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build-and-release:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 0.1.50 release source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item input -ItemType Directory -Force | Out-Null
          gh release download v0.1.50-crediario-legado --repo leandro93jesus-sketch/On-a-pdv-novo --pattern 'ONCA-PDV-PRO-0.1.50-CODIGO-FONTE.zip' --dir input --clobber
          if($LASTEXITCODE -ne 0){throw 'Could not download exact 0.1.50 source'}

      - name: Restore source and apply reviewed 0.1.52 patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive (Resolve-Path 'input/ONCA-PDV-PRO-0.1.50-CODIGO-FONTE.zip').Path source -Force
          python -c "import base64,gzip,pathlib; p=pathlib.Path('patches/onca-052-from-050.patch.gz.b64'); pathlib.Path('onca052.patch').write_bytes(gzip.decompress(base64.b64decode(p.read_text().strip())))"
          if($LASTEXITCODE -ne 0){throw 'Patch unpack failed'}
          $patch=(Resolve-Path onca052.patch).Path
          $hash=(Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SOURCE_PATCH_SHA256=$hash"
          if($hash -ne 'b9df5db3ca6c639dbb6f90b30d074ea32aece75dda8c7ad6c7ac102be73695ef'){throw 'Patch SHA256 mismatch'}
          git apply --check --directory=source --whitespace=nowarn $patch
          if($LASTEXITCODE -ne 0){throw 'Patch incompatible with 0.1.50 source'}
          git apply --directory=source --whitespace=nowarn $patch
          if($LASTEXITCODE -ne 0){throw 'Patch apply failed'}
          foreach($f in @(
            'src/OncaPDV.Infrastructure/IntegrityCenter151.cs',
            'src/OncaPDV.Desktop/IntegrityCenter151Window.xaml',
            'src/OncaPDV.Infrastructure/Finance052.cs',
            'src/OncaPDV.Desktop/Finance052Window.xaml',
            'tests/OncaPDV.Tests/Integrity151Tests.cs',
            'tests/OncaPDV.Tests/Finance052Tests.cs',
            'AI-HANDOFF-151.md',
            'AI-HANDOFF-152.md'
          )){ if(-not (Test-Path (Join-Path source $f))){throw "Missing required file: $f"} }
          Write-Host 'EXACT_052_PATCH_APPLIED=YES'

      - name: Restore .NET 10 test dependencies
        shell: pwsh
        working-directory: source
        run: |
          dotnet restore tests/OncaPDV.Tests/OncaPDV.Tests.csproj --configfile NuGet.Config
          if($LASTEXITCODE -ne 0){throw 'NuGet restore failed'}

      - name: Full regression including integrity and finance tests
        shell: pwsh
        working-directory: source
        run: |
          dotnet test tests/OncaPDV.Tests/OncaPDV.Tests.csproj -c Release --no-restore --logger 'console;verbosity=minimal' --results-directory test-results
          if($LASTEXITCODE -ne 0){throw 'Regression tests failed; no release'}

      - name: Build WPF and XAML with warnings as errors
        shell: pwsh
        working-directory: source
        run: |
          dotnet restore src/OncaPDV.Desktop/OncaPDV.Desktop.csproj --configfile NuGet.Config
          if($LASTEXITCODE -ne 0){throw 'Desktop restore failed'}
          dotnet build src/OncaPDV.Desktop/OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Desktop build failed; no release'}

      - name: Verify menu wiring and version metadata in source
        shell: pwsh
        working-directory: source
        run: |
          $x=Get-Content src/OncaPDV.Desktop/MainWindow.xaml -Raw
          $code=Get-Content src/OncaPDV.Desktop/MainWindow.xaml.cs -Raw
          foreach($handler in @('Finance052_Click','Integrity151_Click')){
            if(-not $x.Contains($handler) -or -not $code.Contains('void '+$handler+'(')){throw "Missing GUI handler $handler"}
          }
          if(-not $x.Contains('0.1.52')){throw 'Main window version not updated'}
          Write-Host 'GUI_151_152_WIRING=YES'

      - name: Publish Windows folder and single EXE
        shell: pwsh
        working-directory: source
        run: |
          dotnet publish src/OncaPDV.Desktop/OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o package/ONCA-PDV-PRO-0.1.52-WIN64
          if($LASTEXITCODE -ne 0){throw 'Folder publish failed'}
          dotnet publish src/OncaPDV.Desktop/OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o package/single
          if($LASTEXITCODE -ne 0){throw 'Single EXE publish failed'}
          foreach($p in @('package/ONCA-PDV-PRO-0.1.52-WIN64/OncaPDV.Desktop.exe','package/single/OncaPDV.Desktop.exe')){
            if(-not (Test-Path $p)){throw "Missing EXE: $p"}
            $v=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $p).Path)
            Write-Host "$p : FileVersion=$($v.FileVersion) Product=$($v.ProductName)"
            if($v.FileVersion -ne '0.1.52.0'){throw 'Wrong version metadata'}
          }

      - name: Start both Windows builds with isolated databases
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          foreach($kind in @('ONCA-PDV-PRO-0.1.52-WIN64','single')){
            $exe=(Resolve-Path "package/$kind/OncaPDV.Desktop.exe").Path
            $env:ONCA_PDV_DATA_ROOT=Join-Path $env:RUNNER_TEMP ('onca052-'+$kind+'-'+[Guid]::NewGuid().ToString('N'))
            New-Item $env:ONCA_PDV_DATA_ROOT -ItemType Directory -Force | Out-Null
            $start=Get-Date
            $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 9
            $p.Refresh()
            if($p.HasExited){throw "$kind crashed at startup. Exit: $($p.ExitCode)"}
            $db=Join-Path $env:ONCA_PDV_DATA_ROOT 'data/onca-pdv-pro.db'
            if(-not (Test-Path $db)){throw "$kind did not initialize database"}
            $p.CloseMainWindow()|Out-Null
            Start-Sleep -Seconds 2
            $p.Refresh()
            if(-not $p.HasExited){$p.Kill($true)}
            $errors=@(Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$start;Level=2} -ErrorAction SilentlyContinue | Where-Object {$_.Message -like '*ONCA-PDV*' -or $_.Message -like '*OncaPDV*'})
            if($errors.Count){throw "Application errors in $kind startup"}
            Write-Host "$kind : WINDOWS_STARTUP_AND_ISOLATED_DB=PASS"
          }

      - name: Package source and binaries
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          @'
          ONÇA PDV PRO 0.1.52 — CENTRO DE INTEGRIDADE + FINANCEIRO
          
          Inclui as duas etapas:
          0.1.51: Centro de Integridade, detector de duplicidades e diagnóstico do crediário.
          0.1.52: Contas a pagar e controle de despesas.
          
          Faça backup de %LOCALAPPDATA%\Onca PDV Pro antes de atualizar.
          O Centro de Integridade não apaga dados automaticamente.
          Contas a pagar aceitam parcelas e pagamentos parciais.
          Despesa em dinheiro exige caixa aberto; outras formas ficam no financeiro sem reduzir dinheiro físico.
          Windows 10/11 x64. Não assinado digitalmente.
          '@ | Set-Content package/ONCA-PDV-PRO-0.1.52-WIN64/LEIA-ME.txt -Encoding UTF8
          Compress-Archive -Path package/ONCA-PDV-PRO-0.1.52-WIN64 -DestinationPath ONCA-PDV-PRO-0.1.52-WINDOWS-PORTATIL.zip -CompressionLevel Optimal -Force
          Copy-Item package/single/OncaPDV.Desktop.exe ONCA-PDV-PRO-0.1.52-INTEGRIDADE-FINANCEIRO.exe
          New-Item source-clean -ItemType Directory -Force|Out-Null
          foreach($dir in @('src','tests','docs')){Copy-Item $dir source-clean/$dir -Recurse -Force}
          foreach($file in @('NuGet.Config','OncaPDV.slnx','AI-HANDOFF.md','AI-HANDOFF-046.md','AI-HANDOFF-050.md','AI-HANDOFF-151.md','AI-HANDOFF-152.md','README.md')){if(Test-Path $file){Copy-Item $file source-clean/$file -Force}}
          Get-ChildItem source-clean -Directory -Recurse | Where-Object {$_.Name -in @('bin','obj','TestResults','test-results','package')} | Sort-Object FullName -Descending | Remove-Item -Recurse -Force
          Get-ChildItem source-clean -File -Recurse | Where-Object {$_.Extension -in @('.exe','.db','.pdb')} | Remove-Item -Force
          Compress-Archive -Path source-clean/* -DestinationPath ONCA-PDV-PRO-0.1.52-CODIGO-FONTE.zip -CompressionLevel Optimal -Force
          Write-Host "DIRECT_EXE_SHA256=$((Get-FileHash ONCA-PDV-PRO-0.1.52-INTEGRIDADE-FINANCEIRO.exe -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "FOLDER_ZIP_SHA256=$((Get-FileHash ONCA-PDV-PRO-0.1.52-WINDOWS-PORTATIL.zip -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "SOURCE_ZIP_SHA256=$((Get-FileHash ONCA-PDV-PRO-0.1.52-CODIGO-FONTE.zip -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.52-INTEGRIDADE-FINANCEIRO
          path: |
            source/ONCA-PDV-PRO-0.1.52-INTEGRIDADE-FINANCEIRO.exe
            source/ONCA-PDV-PRO-0.1.52-WINDOWS-PORTATIL.zip
            source/ONCA-PDV-PRO-0.1.52-CODIGO-FONTE.zip
          retention-days: 30

      - name: Publish tested 0.1.52 release
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.52-integridade-financeiro ONCA-PDV-PRO-0.1.52-INTEGRIDADE-FINANCEIRO.exe ONCA-PDV-PRO-0.1.52-WINDOWS-PORTATIL.zip ONCA-PDV-PRO-0.1.52-CODIGO-FONTE.zip --repo leandro93jesus-sketch/On-a-pdv-novo --target ${{ github.sha }} --title "ONCA PDV PRO 0.1.52 - INTEGRIDADE + FINANCEIRO" --notes "Inclui duas etapas: 0.1.51 Centro de Integridade, detector de duplicidades e diagnostico do crediario; 0.1.52 Contas a pagar parceladas e despesas categorizadas. Mantem historico anterior. Testes completos e smoke Windows com banco isolado. Faça backup antes de atualizar. Windows 10/11 x64. Sem assinatura digital."
          if($LASTEXITCODE -ne 0){throw 'Release creation failed'}
          gh release view v0.1.52-integridade-financeiro --repo leandro93jesus-sketch/On-a-pdv-novo --json url,assets
