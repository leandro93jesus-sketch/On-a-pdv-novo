name: Build ONCA PDV PRO 0.1.5

on:
  push:
    branches:
      - dev/onca-pdv-0.1.5
    paths:
      - 'current/**'
      - '.github/workflows/build-onca-pdv-0.1.5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify version
        shell: pwsh
        run: |
          $csproj = Get-Content ".\current\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj" -Raw
          if ($csproj -notmatch '<Version>0\.1\.5</Version>') { throw "Versao 0.1.5 nao encontrada." }

      - name: Restore tests
        shell: pwsh
        working-directory: .\current
        run: dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config

      - name: Run all tests
        shell: pwsh
        working-directory: .\current
        run: dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Restore Desktop
        shell: pwsh
        working-directory: .\current
        run: dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -r win-x64 --configfile .\NuGet.Config

      - name: Build Desktop Release
        shell: pwsh
        working-directory: .\current
        run: dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained win-x64
        shell: pwsh
        working-directory: .\current
        run: |
          if (Test-Path .\publish) { Remove-Item .\publish -Recurse -Force }
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\publish
          if (-not (Test-Path .\publish\OncaPDV.Desktop.exe)) { throw "OncaPDV.Desktop.exe nao foi gerado." }
          $hash = (Get-FileHash .\publish\OncaPDV.Desktop.exe -Algorithm SHA256).Hash
          "$hash  OncaPDV.Desktop.exe" | Set-Content .\publish\OncaPDV.Desktop.exe.sha256 -Encoding ascii
          Write-Host "EXE SHA256=$hash"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: .\current
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 nao encontrado." }
          & $iscc .\installer\ONCA-PDV-PRO.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar instalador." }
          $setup = ".\installer\Output\ONCA-PDV-PRO-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Instalador nao foi gerado." }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "$hash  ONCA-PDV-PRO-Setup.exe" | Set-Content "$setup.sha256" -Encoding ascii
          Write-Host "SETUP SHA256=$hash"

      - name: Package source
        shell: pwsh
        run: |
          $src = ".\current"
          $dst = ".\ONCA-PDV-PRO-SOURCE-0.1.5.zip"
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $dst -CompressionLevel Optimal

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.5-EXE
          retention-days: 7
          compression-level: 9
          if-no-files-found: error
          path: |
            current/publish/OncaPDV.Desktop.exe
            current/publish/OncaPDV.Desktop.exe.sha256

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.5-SETUP
          retention-days: 7
          compression-level: 9
          if-no-files-found: error
          path: |
            current/installer/Output/ONCA-PDV-PRO-Setup.exe
            current/installer/Output/ONCA-PDV-PRO-Setup.exe.sha256

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.5-SOURCE
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
          path: ONCA-PDV-PRO-SOURCE-0.1.5.zip
