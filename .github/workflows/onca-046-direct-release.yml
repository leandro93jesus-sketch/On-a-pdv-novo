name: Direct Release ONCA 0.1.46 Final
on:
  push:
    paths:
      - '.github/workflows/onca-046-direct-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.46-CREDIARIO-SEGURO.exe
          run-id: 36487855763
          github-token: ${{ github.token }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.46-SOURCE-COMPLETO.zip
          run-id: 36487855763
          github-token: ${{ github.token }}
          path: release
      - name: Verify and publish exact tested files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path (Resolve-Path 'release').Path 'ONCA-PDV-PRO-0.1.46-CREDIARIO-SEGURO.exe'
          $src=Join-Path (Resolve-Path 'release').Path 'ONCA-PDV-PRO-0.1.46-SOURCE-COMPLETO.zip'
          if(-not (Test-Path $exe)){throw 'EXE missing'}
          if(-not (Test-Path $src)){throw 'SOURCE missing'}
          if((Get-Item $exe).Length -lt 100MB){throw 'EXE unexpectedly small'}
          if((Get-Item $src).Length -lt 20KB){throw 'Source unexpectedly small'}
          $fs=[IO.File]::OpenRead($exe)
          try{if($fs.ReadByte() -ne 77 -or $fs.ReadByte() -ne 90){throw 'Invalid EXE header'}}finally{$fs.Dispose()}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead($src)
          try{
            if(-not ($zip.Entries.FullName -contains 'AI-HANDOFF.md')){throw 'AI-HANDOFF missing from source ZIP'}
            if(-not ($zip.Entries.FullName -contains 'AI-HANDOFF-046.md')){throw 'AI-HANDOFF-046 missing'}
            if(-not ($zip.Entries | Where-Object { $_.FullName.EndsWith('CreditSafety046.cs') })){throw 'CreditSafety046 source missing'}
            if(-not ($zip.Entries | Where-Object {$_.FullName -like 'src/OncaPDV.Desktop/*' -or $_.FullName -like 'src\OncaPDV.Desktop\*'})){throw 'Desktop source missing'}
            if(-not ($zip.Entries | Where-Object {$_.FullName -like 'tests/OncaPDV.Tests/*' -or $_.FullName -like 'tests\OncaPDV.Tests\*'})){throw 'Tests missing'}
          }finally{$zip.Dispose()}
          Write-Host "EXE_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "SOURCE_SHA256=$((Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant())"
          gh release create v0.1.46-crediario-seguro $exe $src --repo leandro93jesus-sketch/On-a-pdv-novo --target de5e0e93b32bb4d7f5cab329c8beb99c9f87c902 --title 'ONCA PDV PRO 0.1.46 - EXCLUIR CREDIARIO E CAIXA CONFERIDO' --notes 'Windows x64 portatil. Excluir crediario com PIN e motivo: baixa administrativa apenas do saldo devido, preservando pagamentos e caixa, venda e auditoria. Filtro Excluidos e Conferir recebimentos/caixa. Intencao de baixa persistente antes da transacao; apos queda identifica recibo e caixa anteriores. 152 testes gerais aprovados, seis especificos 046 aprovados, compilacao zero erros, testes WPF de exclusao de crediario, cancelamento/exclusao de venda e MULTIVENDAS. Codigo fonte inclui AI-HANDOFF e AI-HANDOFF-046. Faca backup; mantenha 0.1.45 como fallback. Sem banco real ou credenciais.'
          if($LASTEXITCODE -ne 0){throw "Release failed: $LASTEXITCODE"}
          gh release view v0.1.46-crediario-seguro --repo leandro93jesus-sketch/On-a-pdv-novo --json assets,url
