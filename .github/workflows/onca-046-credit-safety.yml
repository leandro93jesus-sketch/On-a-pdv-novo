name: ONCA 0.1.46 CREDIT EXCLUSION AND CASH SAFETY
on:
  push:
    paths:
      - 'scripts/apply_owner_recovery_043.py'
      - 'scripts/feature043_recovery.xaml'
      - 'scripts/feature043_recovery.xaml.cs'
      - 'scripts/feature043_tests.cs'
      - 'scripts/seed_existing_pin_043.py'
      - 'scripts/test_pin_and_cancel_043.ps1'
      - 'scripts/test_features_043.ps1'
      - 'scripts/feature041_reason.xaml'
      - 'scripts/feature041_reason.xaml.cs'
      - 'scripts/seed_and_check_cancel_041.py'
      - 'scripts/test_cancel_e2e_041.ps1'
      - 'scripts/test_features_041.ps1'
      - 'scripts/feature040_service.cs'
      - 'scripts/feature040_admin.xaml'
      - 'scripts/feature040_admin.xaml.cs'
      - 'scripts/feature040_tests.cs'
      - 'scripts/test_features_040.ps1'
      - 'scripts/test_multisale_startup_038.ps1'
      - 'scripts/apply_sales_integrity_044.py'
      - 'scripts/feature044_tests.cs'
      - 'scripts/verify_delete_044.py'
      - 'scripts/generate_delete_ui_test_044.py'
      - 'scripts/test_features_044.ps1'
      - 'scripts/apply_credit_integrity_045.py'
      - 'scripts/feature045_credit_tests.cs'
      - 'AI-HANDOFF-ONCA-PDV.md'
      - 'AI-HANDOFF-ONCA-PDV-046.md'
      - 'scripts/apply_credit_safety_046.py'
      - 'scripts/feature046_credit_safety.cs'
      - 'scripts/feature046_credit_delete.xaml'
      - 'scripts/feature046_credit_delete.xaml.cs'
      - 'scripts/feature046_credit_tests.cs'
      - '.github/workflows/onca-046-credit-safety.yml'
  workflow_dispatch:
jobs:
  build-test-release:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild proven base
        shell: pwsh
        run: .\scripts\rebuild-onca-016-final.ps1
      - name: Apply 0.1.18
        shell: pwsh
        run: python .\scripts\apply_ui_018.py
      - name: Apply 0.1.19
        shell: pwsh
        run: python .\scripts\apply_ui_019.py
      - name: Apply 0.1.20
        shell: pwsh
        run: python .\scripts\apply_ui_020.py
      - name: Apply 0.1.21 physical print
        shell: pwsh
        run: python .\scripts\apply_print_021.py
      - name: Apply 0.1.22 features
        shell: pwsh
        run: python .\scripts\apply_features_022.py
      - name: Fix nullable product id
        shell: pwsh
        run: python .\scripts\fix_022_guid.py
      - name: Apply proven 0.1.25 credit fix
        shell: pwsh
        run: python .\scripts\apply_ui_025.py
      - name: Apply stable improvements
        shell: pwsh
        run: python .\scripts\apply_stable_plus_025.py
      - name: Apply true simultaneous sales
        shell: pwsh
        run: python .\scripts\apply_multisale_037.py
      - name: Apply isolated cancellation UI patch and regression
        shell: pwsh
        run: python .\scripts\apply_cancel_039.py
      - name: Apply five safety improvements to proven 0.1.39
        shell: pwsh
        run: python .\scripts\apply_features_040.py
      - name: Apply owned cancellation dialogs
        shell: pwsh
        run: python .\scripts\apply_cancel_ui_041.py
      - name: Apply owner PIN reset UI
        shell: pwsh
        run: python .\scripts\apply_owner_pin_042.py
      - name: Apply owner PIN recovery after 0.1.42
        shell: pwsh
        run: python .\scripts\apply_owner_recovery_043.py
      - name: Apply durable checkout and audited deletion
        shell: pwsh
        run: python .\scripts\apply_sales_integrity_044.py
      - name: Apply credit integrity 0.1.45
        shell: pwsh
        run: python .\scripts\apply_credit_integrity_045.py
      - name: Apply audited credit exclusion and durable receipt guard
        shell: pwsh
        run: python .\scripts\apply_credit_safety_046.py
      - name: Inspect new credit UI and ledger safety
        shell: pwsh
        run: |
          $ui=Get-Content '.\work-final\ONCA-PDV-PRO\src\OncaPDV.Desktop\CreditWindow.xaml' -Raw
          $code=Get-Content '.\work-final\ONCA-PDV-PRO\src\OncaPDV.Desktop\CreditWindow.xaml.cs' -Raw
          $data=Get-Content '.\work-final\ONCA-PDV-PRO\src\OncaPDV.Infrastructure\Database.cs' -Raw
          foreach($t in @('EXCLUIR CREDIÁRIO','CONFERIR RECEBIMENTOS / CAIXA','EXCLUÍDOS')){if(-not $ui.Contains($t)){throw "Missing UI: $t"}}
          foreach($t in @('DeleteCredit046_Click','ProcessReceipt046','PendingAsync','AcknowledgeAsync','AbandonUncommittedAsync')){if(-not $code.Contains($t)){throw "Missing UI flow: $t"}}
          foreach($t in @('credit_account_deletions_046','credit_receipt_intents_046','ux_credit_pending_intent_046')){if(-not $data.Contains($t)){throw "Missing additive table: $t"}}
      - name: Verify credit hardening is wired
        shell: pwsh
        run: |
          $db=Get-Content '.\work-final\ONCA-PDV-PRO\src\OncaPDV.Infrastructure\Database.cs' -Raw
          $cr=Get-Content '.\work-final\ONCA-PDV-PRO\src\OncaPDV.Infrastructure\CustomerCredit.cs' -Raw
          $cw=Get-Content '.\work-final\ONCA-PDV-PRO\src\OncaPDV.Desktop\CreditWindow.xaml.cs' -Raw
          foreach($t in @('credit_receipt_requests_045','credit_receipt_cash_links_045','creditTotal')){if(-not $db.Contains($t)){throw "Missing credit database protection: $t"}}
          foreach($t in @('ReceiveOnceAsync','requestId','balance >= $amount')){if(-not $cr.Contains($t)){throw "Missing receipt idempotency: $t"}}
          if(-not $cw.Contains('_receiving045')){throw 'Credit UI mutation guard absent'}
      - name: Verify multivendas UI and logic
        shell: pwsh
        run: |
          $r='.\work-final\ONCA-PDV-PRO\src\OncaPDV.Desktop'
          $x=Get-Content "$r\MainWindow.xaml" -Raw
          $c=Get-Content "$r\MainWindow.xaml.cs" -Raw
          foreach($t in @('MultiSaleTabsPanel','+ NOVA VENDA','FECHAR ABA')){if(-not $x.Contains($t)){throw "Missing multivendas UI: $t"}}
          foreach($t in @('NewMultiSale_Click','SwitchMultiSale037','CloneCart037','SyncCurrentMultiSale037')){if(-not $c.Contains($t)){throw "Missing multivendas logic: $t"}}
          if($x.Contains('Content="⏸   VENDA EM ESPERA"')){throw 'Old wait-sale shortcut is still visible'}
          if($c.Contains('Loaded += (_, _) => InitializeMultiSales037();')){throw 'Old early recovery startup path detected'}
          if(-not $c.Contains('await RestoreMultiSales040();')){throw 'Recovery restore not wired'}
          if(-not $c.Contains('FinalizeActiveTab040();')){throw 'Independent paid-tab reset absent'}
          if(-not $c.Contains('if(_finalizing040 || _multiSaleSwitching037) return;')){throw 'Double-payment guard absent'}
          if(-not $x.Contains('RENOMEAR ABA')){throw 'Rename-tab control absent'}
          if($c.Contains('InitializeComponent();' + [Environment]::NewLine + '        InitializeMultiSales037();')){throw 'Unsafe early tabs initialization found'}
      - name: Full regression tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
      - name: Build Desktop warnings as errors
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj --configfile .\NuGet.Config
          dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
      - name: Publish portable EXE
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\portable046
          Copy-Item '.\portable046\OncaPDV.Desktop.exe' '.\portable046\ONCA-PDV-PRO-0.1.46-CREDIARIO-SEGURO.exe' -Force
      - name: PIN setup and completed sale cancellation end to end
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $prior=Get-Content ..\..\scripts\test_pin_and_cancel_043.ps1 -Raw
          $adjusted=$prior.Replace('portable043\ONCA-PDV-PRO-0.1.43-PIN-RECUPERADO.exe','portable046\ONCA-PDV-PRO-0.1.46-CREDIARIO-SEGURO.exe')
          Set-Content .\test-cancel044.ps1 $adjusted -Encoding UTF8
          .\test-cancel044.ps1
      - name: Multivendas user interface regression
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $prior=Get-Content ..\..\scripts\test_features_044.ps1 -Raw
          $adjusted=$prior.Replace('portable044\ONCA-PDV-PRO-0.1.44-VENDAS-CORRIGIDAS.exe','portable046\ONCA-PDV-PRO-0.1.46-CREDIARIO-SEGURO.exe')
          Set-Content .\test-features045.ps1 $adjusted -Encoding UTF8
          .\test-features045.ps1
      - name: Generate delete-sale GUI regression from proven UI harness
        shell: pwsh
        run: python .\scripts\generate_delete_ui_test_044.py
      - name: Delete a real test sale through UI and verify database + search
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $delete=Get-Content ..\..\scripts\test_delete_e2e_044.ps1 -Raw
          $delete=$delete.Replace('portable044\ONCA-PDV-PRO-0.1.44-VENDAS-CORRIGIDAS.exe','portable046\ONCA-PDV-PRO-0.1.46-CREDIARIO-SEGURO.exe')
          Set-Content .\test-delete045.ps1 $delete -Encoding UTF8
          .\test-delete045.ps1
      - name: Dedicated crediario integrity tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --filter FullyQualifiedName~CreditSafety046Tests --logger "console;verbosity=normal"
      - name: Dedicated receipt and account deletion tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --filter FullyQualifiedName~CreditSafety046Tests --logger "console;verbosity=normal"
      - name: Package complete source for AI continuation
        shell: pwsh
        run: |
          $src=(Resolve-Path '.\work-final\ONCA-PDV-PRO').Path
          $stage=Join-Path (Get-Location) 'ONCA-PDV-PRO-0.1.46-SOURCE'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          Copy-Item $src $stage -Recurse
          Get-ChildItem $stage -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj','portable046','.git','TestResults') } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force
          Get-ChildItem $stage -File -Recurse | Where-Object { $_.Extension -in @('.exe','.db','.pdb') } | Remove-Item -Force
          Copy-Item '.\AI-HANDOFF-ONCA-PDV.md' (Join-Path $stage 'AI-HANDOFF.md') -Force
          Copy-Item '.\AI-HANDOFF-ONCA-PDV-046.md' (Join-Path $stage 'AI-HANDOFF-046.md') -Force
          $zip=Join-Path (Get-Location) 'ONCA-PDV-PRO-0.1.46-SOURCE-COMPLETO.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          if((Get-Item $zip).Length -lt 20KB){throw 'Source package unexpectedly small'}
      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.46-CREDIARIO-SEGURO.exe
          path: work-final/ONCA-PDV-PRO/portable046/ONCA-PDV-PRO-0.1.46-CREDIARIO-SEGURO.exe
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.46-SOURCE-COMPLETO.zip
          path: ONCA-PDV-PRO-0.1.46-SOURCE-COMPLETO.zip
          retention-days: 30
          if-no-files-found: error
