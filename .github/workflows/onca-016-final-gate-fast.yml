name: ONCA 0.1.16 FINAL GATE FAST
on:
  push:
    paths:
      - '.github/workflows/onca-016-final-gate-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-feature-stress:
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild exact final source
        shell: pwsh
        run: .\scripts\rebuild-onca-016-final.ps1
      - name: Restore and build tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet build .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore -warnaserror
      - name: Stress latest final features 20x
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          for($i=1;$i -le 20;$i++){
            dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~FinalFeaturesTests" --logger "console;verbosity=minimal"
            if($LASTEXITCODE -ne 0){throw "Final feature shard ${{ matrix.shard }} failed repetition $i"}
          }
  package:
    needs: final-feature-stress
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild exact final candidate
        shell: pwsh
        run: .\scripts\rebuild-onca-016-final.ps1
      - name: Full regression
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore
      - name: Verify protected rules and latest features
        shell: pwsh
        run: |
          $r='.\work-final\ONCA-PDV-PRO'
          $m=Get-Content "$r\src\OncaPDV.Desktop\MainWindow.xaml.cs" -Raw
          $x=Get-Content "$r\src\OncaPDV.Desktop\MainWindow.xaml" -Raw
          $s=Get-Content "$r\src\OncaPDV.Infrastructure\FinalFeaturesService.cs" -Raw
          foreach($v in @('Deseja imprimir o comprovante?','if (shouldPrint)','HoldSale_Click','FinalOps_Click')){if(-not $m.Contains($v)){throw "Missing $v"}}
          foreach($v in @('Colocar venda em espera','Trocas / Devoluções / Despesas','v0.1.16')){if(-not $x.Contains($v)){throw "Missing UI $v"}}
          foreach($v in @('HoldAsync','ReturnItemAsync','ExchangeItemAsync','AddExpenseAsync','SummaryAsync')){if(-not $s.Contains($v)){throw "Missing service $v"}}
      - name: Build Desktop with warnings as errors
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj --configfile .\NuGet.Config
          dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o .\publish-full
          if(-not(Test-Path '.\publish-full\OncaPDV.Desktop.exe')){throw 'Published EXE missing'}
      - name: Build final installer
        shell: pwsh
        run: |
          $dst='.\installer\publish-full';if(Test-Path $dst){Remove-Item $dst -Recurse -Force};Copy-Item '.\work-final\ONCA-PDV-PRO\publish-full' $dst -Recurse -Force
          choco install nsis -y --no-progress
          $m=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source;if(-not $m){$m=@('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')|Where-Object{Test-Path $_}|Select-Object -First 1};if(-not $m){throw 'NSIS missing'}
          Push-Location .\installer;& $m '.\ONCA-PDV-PRO-0.1.16-base0111.nsi';if($LASTEXITCODE -ne 0){throw 'Installer failed'};Pop-Location
          Copy-Item '.\installer\ONCA-PDV-PRO-Setup-0.1.16-BASE-0111.exe' '.\installer\ONCA-PDV-PRO-Setup-0.1.16-FINAL-COMPLETO.exe' -Force
      - name: Install and launch 10x
        shell: pwsh
        run: |
          $setup=Resolve-Path '.\installer\ONCA-PDV-PRO-Setup-0.1.16-FINAL-COMPLETO.exe'
          for($i=1;$i -le 10;$i++){
            $dir=Join-Path $env:RUNNER_TEMP ("ONCA-FINAL-GATE-"+$i)
            $p=Start-Process -FilePath $setup -ArgumentList @('/S',"/D=$dir") -Wait -PassThru
            if($p.ExitCode -ne 0){throw "Install failed $i"}
            $exe=Join-Path $dir 'OncaPDV.Desktop.exe';if(-not(Test-Path $exe)){throw "EXE missing $i"}
            $app=Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if(-not $app.WaitForExit(30000)){try{$app.Kill($true)}catch{};throw "Launch timeout $i"}
            if($app.ExitCode -ne 0){throw "Launch failed $i"}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.16-FINAL-COMPLETO
          path: installer/ONCA-PDV-PRO-Setup-0.1.16-FINAL-COMPLETO.exe
          retention-days: 7
          if-no-files-found: error
