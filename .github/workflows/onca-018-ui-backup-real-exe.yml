name: ONCA 0.1.18 UI BACKUP REAL EXE
on:
  push:
    paths:
      - '.github/workflows/onca-018-ui-backup-real-exe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild approved current base
        shell: pwsh
        run: .\scripts\rebuild-onca-016-final.ps1
      - name: Apply UI backup and BRL corrections
        shell: pwsh
        run: .\scripts\apply-ui-018-fixed.ps1
      - name: Verify requested changes
        shell: pwsh
        run: |
          $d='.\work-final\ONCA-PDV-PRO\src\OncaPDV.Desktop'
          $main=Get-Content "$d\MainWindow.xaml" -Raw
          $app=Get-Content "$d\App.xaml.cs" -Raw
          $div=Get-Content "$d\DiversosWindow.xaml" -Raw
          if(-not $main.Contains('BackupCenter_Click')){throw 'Backup nav missing'}
          if(-not $main.Contains('DisplaySettings_Click')){throw 'Display settings nav missing'}
          if($main.Contains('Caixa / Backup')){throw 'Old hidden backup label remains'}
          if(-not $app.Contains('pt-BR')){throw 'BRL culture missing'}
          if(-not $div.Contains('R$')){throw 'Diversos BRL prefix missing'}
          if(-not(Test-Path "$d\BackupWindow.xaml")){throw 'Backup window missing'}
          if(-not(Test-Path "$d\DisplaySettingsWindow.xaml")){throw 'Display settings window missing'}
      - name: Full regression tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
      - name: Build Desktop warnings as errors
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj --configfile .\NuGet.Config
          dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
      - name: Publish portable EXE
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\portable018
          if(-not(Test-Path '.\portable018\OncaPDV.Desktop.exe')){throw 'EXE missing'}
          Copy-Item '.\portable018\OncaPDV.Desktop.exe' '.\portable018\ONCA-PDV-PRO-0.1.18-TESTE-UI-BACKUP-REAL.exe' -Force
      - name: Smoke launch 3x
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $exe=Resolve-Path '.\portable018\ONCA-PDV-PRO-0.1.18-TESTE-UI-BACKUP-REAL.exe'
          1..3 | ForEach-Object {
            $p=Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if(-not $p.WaitForExit(30000)){try{$p.Kill($true)}catch{};throw "Smoke timeout $_"}
            if($p.ExitCode -ne 0){throw "Smoke failed $_ exit $($p.ExitCode)"}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.18-TESTE-UI-BACKUP-REAL
          path: work-final/ONCA-PDV-PRO/portable018/ONCA-PDV-PRO-0.1.18-TESTE-UI-BACKUP-REAL.exe
          retention-days: 7
          if-no-files-found: error
# rerun robust culture patch
