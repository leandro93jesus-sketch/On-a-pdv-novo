name: ONCA 0.1.19 FINAL UI TEST
on:
  push:
    paths:
      - '.github/workflows/onca-019-final-ui-test.yml'
      - 'scripts/apply_ui_019.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild approved base
        shell: pwsh
        run: .\scripts\rebuild-onca-016-final.ps1
      - name: Apply 0.1.18 baseline UI
        shell: pwsh
        run: python .\scripts\apply_ui_018.py
      - name: Apply 0.1.19 improvements
        shell: pwsh
        run: python .\scripts\apply_ui_019.py
      - name: Verify requested UI features
        shell: pwsh
        run: |
          $d='.\work-final\ONCA-PDV-PRO\src\OncaPDV.Desktop'
          $main=Get-Content "$d\MainWindow.xaml" -Raw
          $cs=Get-Content "$d\MainWindow.xaml.cs" -Raw
          $div=Get-Content "$d\DiversosWindow.xaml" -Raw
          if($cs.Contains('EnsureDailyBackupAsync')){throw 'Automatic backup must be disabled'}
          foreach($s in @('F3 Consultar','F4 Diversos','F5 Calculadora','LastBackupText','QuickPriceWindow','Calculator_Click')){if(-not(($main+$cs).Contains($s))){throw "Missing $s"}}
          if(-not $div.Contains('QuantityBox')){throw 'Diversos quantity missing'}
          if(-not $div.Contains('RecentList')){throw 'Diversos recent list missing'}
          if(-not(Test-Path "$d\QuickPriceWindow.xaml")){throw 'Quick price window missing'}
          if(-not(Test-Path "$d\CalculatorWindow.xaml")){throw 'Calculator window missing'}
      - name: Full regression tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
      - name: Build Desktop warnings as errors
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj --configfile .\NuGet.Config
          dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
      - name: Publish EXE
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\portable019
          Copy-Item '.\portable019\OncaPDV.Desktop.exe' '.\portable019\ONCA-PDV-PRO-0.1.19-MELHORIAS-UI.exe' -Force
      - name: Smoke launch 5x
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $exe=Resolve-Path '.\portable019\ONCA-PDV-PRO-0.1.19-MELHORIAS-UI.exe'
          1..5 | ForEach-Object {$p=Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru;if(-not $p.WaitForExit(30000)){try{$p.Kill($true)}catch{};throw "Smoke timeout $_"};if($p.ExitCode -ne 0){throw "Smoke failed $_"}}
      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.19-MELHORIAS-UI
          path: work-final/ONCA-PDV-PRO/portable019/ONCA-PDV-PRO-0.1.19-MELHORIAS-UI.exe
          retention-days: 7
          if-no-files-found: error
