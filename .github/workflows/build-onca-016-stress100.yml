name: Build ONCA 0.1.16 stress 100x

on:
  push:
    paths:
      - '.github/workflows/build-onca-016-stress100.yml'
      - 'patches/016/**'
      - 'installer/ONCA-PDV-PRO-0.1.16-base0111.nsi'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-stress:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild approved 0.1.15 source base
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\work" -Force | Out-Null
          Expand-Archive ".\ONCA-PDV-PRO-ATUALIZADO-0.1.3.zip" ".\work" -Force
          $encoded=(Get-Content ".\patches\onca-0111-melhorias-hoje.patch.gz.b64" -Raw) -replace "\s",""
          [IO.File]::WriteAllBytes(".\base.gz",[Convert]::FromBase64String($encoded))
          $i=[IO.File]::OpenRead(".\base.gz");$o=[IO.File]::Create(".\base.patch");$g=[IO.Compression.GzipStream]::new($i,[IO.Compression.CompressionMode]::Decompress)
          try{$g.CopyTo($o)}finally{$g.Dispose();$o.Dispose();$i.Dispose()}
          Push-Location ".\work\ONCA-PDV-PRO"; git init | Out-Null; git apply "..\..\base.patch"; if($LASTEXITCODE -ne 0){throw "Base patch failed"}; Pop-Location
          $src=".\patches\0.1.12";$dst=".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop"
          foreach($n in @("ProductSelectionWindow.xaml","ProductSelectionWindow.xaml.cs","DiversosWindow.xaml","DiversosWindow.xaml.cs")){Copy-Item (Join-Path $src $n) (Join-Path $dst $n) -Force}
          $main=Join-Path $dst "MainWindow.xaml.cs";$t=Get-Content $main -Raw
          $t=[regex]::Replace($t,'new ProductSelectionWindow\(([^,\r\n]+),\s*([^,\r\n\)]+)(,\s*(?:true|false))?\)','new ProductSelectionWindow($2, $1$3)');Set-Content $main $t -Encoding UTF8
          $div=Join-Path $dst "DiversosWindow.xaml.cs";$d=Get-Content $div -Raw;$d=$d.Replace('public decimal Price { get; private set; }',"public decimal Price { get; private set; }`r`n    public decimal Quantity => 1m;`r`n    public decimal UnitPrice => Price;");Set-Content $div $d -Encoding UTF8
          $file=Join-Path $dst "CreditWindow.xaml";$t=Get-Content $file -Raw
          $needle='<TextBlock Text="DETALHES DO CLIENTE / CONTA" FontWeight="Bold" Foreground="#33423A"/>';$button='<Button Style="{StaticResource RoundedButton}" Content="💵  RECEBER PAGAMENTO  [F9]" FontSize="17" MinHeight="52" Margin="0,10,0,12" Click="Receive_Click"/>'
          if(-not $t.Contains($needle)){throw "Credit anchor missing"};$t=$t.Replace($needle,$needle+"`r`n"+$button);Set-Content $file $t -Encoding UTF8
          @'
          <Window x:Class="OncaPDV.Desktop.ReceiveCreditWindow" xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml" Title="Receber crediário" Width="500" Height="540" MinHeight="470" MinWidth="460" WindowStartupLocation="CenterOwner" ResizeMode="CanResize">
            <Grid Margin="24"><Grid.RowDefinitions><RowDefinition Height="*"/><RowDefinition Height="Auto"/></Grid.RowDefinitions>
              <ScrollViewer Grid.Row="0" VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled"><StackPanel>
                <TextBlock x:Name="Customer" FontSize="22" FontWeight="Bold"/><TextBlock x:Name="Balance" FontSize="18" Margin="0,4,0,20"/>
                <TextBlock Text="VALOR RECEBIDO"/><TextBox x:Name="AmountBox" FontSize="22"/><TextBlock x:Name="RemainingText" FontSize="15" FontWeight="SemiBold" Margin="0,6,0,0"/>
                <TextBlock Text="FORMA DE PAGAMENTO" Margin="0,15,0,0"/><ComboBox x:Name="MethodBox" FontSize="18"><ComboBoxItem Content="Dinheiro" IsSelected="True"/><ComboBoxItem Content="Pix"/><ComboBoxItem Content="Débito"/><ComboBoxItem Content="Crédito"/></ComboBox>
                <TextBlock Text="OBSERVAÇÃO" Margin="0,15,0,0"/><TextBox x:Name="NotesBox" MinHeight="50" TextWrapping="Wrap" AcceptsReturn="True"/>
              </StackPanel></ScrollViewer>
              <Button Grid.Row="1" Content="CONFIRMAR RECEBIMENTO" Height="54" FontSize="18" FontWeight="Bold" Margin="0,18,0,0" Click="Confirm_Click"/>
            </Grid>
          </Window>
          '@ | Set-Content (Join-Path $dst "ReceiveCreditWindow.xaml") -Encoding UTF8

      - name: Apply 0.1.16 improvements and compile fixes
        shell: pwsh
        run: |
          $encoded=(Get-ChildItem ".\patches\016\part-*" | Sort-Object Name | ForEach-Object {Get-Content $_.FullName -Raw}) -join "";$encoded=$encoded -replace "\s",""
          [IO.File]::WriteAllBytes(".\u16.gz",[Convert]::FromBase64String($encoded));$i=[IO.File]::OpenRead(".\u16.gz");$o=[IO.File]::Create(".\u16.patch");$g=[IO.Compression.GzipStream]::new($i,[IO.Compression.CompressionMode]::Decompress)
          try{$g.CopyTo($o)}finally{$g.Dispose();$o.Dispose();$i.Dispose()}
          Push-Location ".\work\ONCA-PDV-PRO"
          git apply "..\..\u16.patch"; if($LASTEXITCODE -ne 0){throw "0.1.16 patch failed"}
          git apply "..\..\patches\016\fix-raw-string.patch"; if($LASTEXITCODE -ne 0){throw "SQL compile fix failed"}
          git apply "..\..\patches\016\fix-mainwindow-closing.patch"; if($LASTEXITCODE -ne 0){throw "Closing compile fix failed"}
          $p=".\src\OncaPDV.Desktop\MainWindow.xaml.cs";$t=Get-Content $p -Raw;$old='else if (e.Key == Key.F8) _ = OpenLastSale();';$new='else if (e.Key == Key.F8) OpenLastSale();';if(-not $t.Contains($old)){throw "F8 target missing"};$t=$t.Replace($old,$new);Set-Content $p $t -Encoding UTF8
          Pop-Location

      - name: Verify protected behavior
        shell: pwsh
        run: |
          $root=".\work\ONCA-PDV-PRO";$main=Get-Content "$root\src\OncaPDV.Desktop\MainWindow.xaml.cs" -Raw;$xaml=Get-Content "$root\src\OncaPDV.Desktop\MainWindow.xaml" -Raw;$adv=Get-Content "$root\src\OncaPDV.Infrastructure\AdvancedOperations.cs" -Raw
          if(-not $xaml.Contains('v0.1.16')){throw "Version missing"}
          if(-not $main.Contains('Deseja imprimir o comprovante?')){throw "Print prompt missing"}
          if(-not $main.Contains('if (shouldPrint)')){throw "Print gate missing"}
          foreach($m in @('CancelSaleAsync','ReverseCreditReceiptAsync','ChangeSinglePaymentMethodAsync','SaveQuoteAsync','SaveFiscalDraftAsync','ReopenLastCashAsync')){if(-not $adv.Contains($m)){throw "Missing $m"}}
          if(-not (Get-Content "$root\src\OncaPDV.Desktop\CreditWindow.xaml" -Raw).Contains('MinHeight="52"')){throw "Approved credit button missing"}
          if(-not (Get-Content "$root\src\OncaPDV.Desktop\PurchasesWindow.xaml.cs" -Raw).Contains('qCom')){throw "Supplier XML import missing"}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Full regression once
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore

      - name: Stress critical functions 100 times
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          $filter='FullyQualifiedName~Sale|FullyQualifiedName~Credit|FullyQualifiedName~Cash|FullyQualifiedName~Payment|FullyQualifiedName~Cart|FullyQualifiedName~Quote|FullyQualifiedName~Fiscal|FullyQualifiedName~Purchase|FullyQualifiedName~Customer|FullyQualifiedName~Print|FullyQualifiedName~Backup|FullyQualifiedName~Restore'
          for($i=1;$i -le 100;$i++){
            Write-Host "===== STRESS CICLO $i / 100 ====="
            dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-build --no-restore --filter $filter --logger "console;verbosity=minimal"
            if($LASTEXITCODE -ne 0){throw "Stress failed on cycle $i"}
          }

      - name: Publish self-contained Windows app
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o .\publish-full
          if(-not (Test-Path ".\publish-full\OncaPDV.Desktop.exe")){throw "Published EXE missing"}

      - name: Build installer
        shell: pwsh
        run: |
          $dst=".\installer\publish-full";if(Test-Path $dst){Remove-Item $dst -Recurse -Force};Copy-Item ".\work\ONCA-PDV-PRO\publish-full" $dst -Recurse -Force
          choco install nsis -y --no-progress
          $m=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source;if(-not $m){$m=@("C:\Program Files (x86)\NSIS\makensis.exe","C:\Program Files\NSIS\makensis.exe")|?{Test-Path $_}|select -First 1};if(-not $m){throw "NSIS missing"}
          Push-Location .\installer;& $m ".\ONCA-PDV-PRO-0.1.16-base0111.nsi";if($LASTEXITCODE -ne 0){throw "Installer failed"};Pop-Location

      - name: Install and launch smoke 10 times
        shell: pwsh
        run: |
          $setup=Resolve-Path ".\installer\ONCA-PDV-PRO-Setup-0.1.16-BASE-0111.exe"
          for($i=1;$i -le 10;$i++){
            $dir=Join-Path $env:RUNNER_TEMP ("ONCA-016-"+$i)
            $p=Start-Process -FilePath $setup -ArgumentList @("/S","/D=$dir") -PassThru -Wait;if($p.ExitCode -ne 0){throw "Install failed cycle $i"}
            $app=Start-Process -FilePath (Join-Path $dir "OncaPDV.Desktop.exe") -ArgumentList "--smoke-test" -PassThru;if(-not $app.WaitForExit(30000)){try{$app.Kill($true)}catch{};throw "Launch timeout cycle $i"};if($app.ExitCode -ne 0){throw "Launch failed cycle $i"}
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.16-STRESS100-FINAL
          retention-days: 7
          if-no-files-found: error
          path: installer/ONCA-PDV-PRO-Setup-0.1.16-BASE-0111.exe
