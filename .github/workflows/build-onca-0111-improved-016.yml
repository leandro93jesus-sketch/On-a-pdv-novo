name: Build ONCA 0.1.16 selected improvements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-onca-0111-improved-016.yml'
      - 'installer/ONCA-PDV-PRO-0.1.16-base0111.nsi'
      - 'patches/016/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract base
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\work" -Force | Out-Null
          Expand-Archive ".\ONCA-PDV-PRO-ATUALIZADO-0.1.3.zip" ".\work" -Force

      - name: Apply approved 0.1.15 improvements base
        shell: pwsh
        run: |
          $encoded=(Get-Content ".\patches\onca-0111-melhorias-hoje.patch.gz.b64" -Raw) -replace "\s",""
          $gz=Join-Path $PWD "base.patch.gz"; $patch=Join-Path $PWD "base.patch"
          [IO.File]::WriteAllBytes($gz,[Convert]::FromBase64String($encoded))
          $input=[IO.File]::OpenRead($gz); $output=[IO.File]::Create($patch)
          $gzip=[IO.Compression.GzipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          try { $gzip.CopyTo($output) } finally { $gzip.Dispose();$output.Dispose();$input.Dispose() }
          Push-Location ".\work\ONCA-PDV-PRO"
          try { git init | Out-Null; git apply $patch; if($LASTEXITCODE -ne 0){throw "Base patch failed"} } finally { Pop-Location }

      - name: Add approved dialogs
        shell: pwsh
        run: |
          $src=".\patches\0.1.12"; $dst=".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop"
          foreach($name in @("ProductSelectionWindow.xaml","ProductSelectionWindow.xaml.cs","DiversosWindow.xaml","DiversosWindow.xaml.cs")){ Copy-Item (Join-Path $src $name) (Join-Path $dst $name) -Force }
          $main=Join-Path $dst "MainWindow.xaml.cs"; $text=Get-Content $main -Raw
          $text=[regex]::Replace($text,'new ProductSelectionWindow\(([^,\r\n]+),\s*([^,\r\n\)]+)(,\s*(?:true|false))?\)','new ProductSelectionWindow($2, $1$3)')
          Set-Content $main $text -Encoding UTF8
          $div=Join-Path $dst "DiversosWindow.xaml.cs"; $d=Get-Content $div -Raw
          $d=$d.Replace('public decimal Price { get; private set; }',"public decimal Price { get; private set; }`r`n    public decimal Quantity => 1m;`r`n    public decimal UnitPrice => Price;")
          Set-Content $div $d -Encoding UTF8

      - name: Reproduce approved 0.1.15 credit UI
        shell: pwsh
        run: |
          $file=".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop\CreditWindow.xaml"; $text=Get-Content $file -Raw
          $needle='<TextBlock Text="DETALHES DO CLIENTE / CONTA" FontWeight="Bold" Foreground="#33423A"/>'
          $button='<Button Style="{StaticResource RoundedButton}" Content="💵  RECEBER PAGAMENTO  [F9]" FontSize="17" MinHeight="52" Margin="0,10,0,12" Click="Receive_Click"/>'
          if(-not $text.Contains($needle)){throw "Credit anchor missing"}; $text=$text.Replace($needle,$needle+"`r`n"+$button); Set-Content $file $text -Encoding UTF8
          $popup=".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop\ReceiveCreditWindow.xaml"
          @'
          <Window x:Class="OncaPDV.Desktop.ReceiveCreditWindow" xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml" Title="Receber crediário" Width="500" Height="540" MinHeight="470" MinWidth="460" WindowStartupLocation="CenterOwner" ResizeMode="CanResize">
            <Grid Margin="24"><Grid.RowDefinitions><RowDefinition Height="*"/><RowDefinition Height="Auto"/></Grid.RowDefinitions>
              <ScrollViewer Grid.Row="0" VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled"><StackPanel>
                <TextBlock x:Name="Customer" FontSize="22" FontWeight="Bold"/><TextBlock x:Name="Balance" FontSize="18" Margin="0,4,0,20"/>
                <TextBlock Text="VALOR RECEBIDO"/><TextBox x:Name="AmountBox" FontSize="22"/><TextBlock x:Name="RemainingText" FontSize="15" FontWeight="SemiBold" Margin="0,6,0,0"/>
                <TextBlock Text="FORMA DE PAGAMENTO" Margin="0,15,0,0"/><ComboBox x:Name="MethodBox" FontSize="18"><ComboBoxItem Content="Dinheiro" IsSelected="True"/><ComboBoxItem Content="Pix"/><ComboBoxItem Content="Débito"/><ComboBoxItem Content="Crédito"/></ComboBox>
                <TextBlock Text="OBSERVAÇÃO" Margin="0,15,0,0"/><TextBox x:Name="NotesBox" MinHeight="50" TextWrapping="Wrap" AcceptsReturn="True"/>
              </StackPanel></ScrollViewer>
              <Button Grid.Row="1" Content="CONFIRMAR RECEBIMENTO" Height="54" FontSize="18" FontWeight="Bold" Margin="0,18,0,0" Click="Confirm_Click"/>
            </Grid>
          </Window>
          '@ | Set-Content $popup -Encoding UTF8

      - name: Apply 0.1.16 selected improvements
        shell: pwsh
        run: |
          $encoded=(Get-ChildItem ".\patches\016\part-*" | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $encoded=$encoded -replace "\s",""
          $gz=Join-Path $PWD "update016.patch.gz"; $patch=Join-Path $PWD "update016.patch"
          [IO.File]::WriteAllBytes($gz,[Convert]::FromBase64String($encoded))
          $input=[IO.File]::OpenRead($gz); $output=[IO.File]::Create($patch)
          $gzip=[IO.Compression.GzipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          try { $gzip.CopyTo($output) } finally { $gzip.Dispose();$output.Dispose();$input.Dispose() }
          Push-Location ".\work\ONCA-PDV-PRO"
          try { git apply $patch; if($LASTEXITCODE -ne 0){throw "0.1.16 patch failed"} } finally { Pop-Location }

      - name: Verify protected behavior and new functions
        shell: pwsh
        run: |
          $root=".\work\ONCA-PDV-PRO"
          $main=Get-Content "$root\src\OncaPDV.Desktop\MainWindow.xaml.cs" -Raw
          $xaml=Get-Content "$root\src\OncaPDV.Desktop\MainWindow.xaml" -Raw
          $adv=Get-Content "$root\src\OncaPDV.Infrastructure\AdvancedOperations.cs" -Raw
          if(-not $xaml.Contains('v0.1.16')){throw "Version label missing"}
          if(-not $main.Contains('Deseja imprimir o comprovante?')){throw "Sale print confirmation was lost"}
          if(-not $main.Contains('if (shouldPrint)')){throw "Sale print gate was lost"}
          foreach($m in @('CancelSaleAsync','ReverseCreditReceiptAsync','ChangeSinglePaymentMethodAsync','SaveQuoteAsync','SaveFiscalDraftAsync','ReopenLastCashAsync')){if(-not $adv.Contains($m)){throw "Missing $m"}}
          $credit=Get-Content "$root\src\OncaPDV.Desktop\CreditWindow.xaml" -Raw; if(-not $credit.Contains('MinHeight="52"')){throw "Approved credit receive button missing"}
          $purchase=Get-Content "$root\src\OncaPDV.Desktop\PurchasesWindow.xaml.cs" -Raw; if(-not $purchase.Contains('qCom')){throw "Supplier XML import missing"}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and test full regression suite
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore

      - name: Publish
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o .\publish-full
          if (-not (Test-Path ".\publish-full\OncaPDV.Desktop.exe")) { throw "Published EXE not found" }

      - name: Prepare installer
        shell: pwsh
        run: |
          $dst=".\installer\publish-full"; if(Test-Path $dst){Remove-Item $dst -Recurse -Force}; Copy-Item ".\work\ONCA-PDV-PRO\publish-full" $dst -Recurse -Force

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: .\installer
        run: |
          $makensis=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if(-not $makensis){$makensis=@("C:\Program Files (x86)\NSIS\makensis.exe","C:\Program Files\NSIS\makensis.exe")|?{Test-Path $_}|select -First 1}
          if(-not $makensis){ throw "NSIS not found" }; & $makensis ".\ONCA-PDV-PRO-0.1.16-base0111.nsi"; if($LASTEXITCODE -ne 0){throw "Installer build failed"}

      - name: Install and launch smoke test
        shell: pwsh
        working-directory: .\installer
        run: |
          $setup=Resolve-Path ".\ONCA-PDV-PRO-Setup-0.1.16-BASE-0111.exe"; $dir=Join-Path $env:RUNNER_TEMP "ONCA-016"
          $p=Start-Process -FilePath $setup -ArgumentList @("/S","/D=$dir") -PassThru -Wait; if($p.ExitCode -ne 0){throw "Installer failed"}
          $app=Start-Process -FilePath (Join-Path $dir "OncaPDV.Desktop.exe") -ArgumentList "--smoke-test" -PassThru
          if(-not $app.WaitForExit(30000)){try{$app.Kill($true)}catch{};throw "Launch timeout"}; if($app.ExitCode -ne 0){throw "Launch failed"}

      - name: Upload final installer
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.16-MELHORIAS-SELECIONADAS-FINAL
          retention-days: 7
          if-no-files-found: error
          path: installer/ONCA-PDV-PRO-Setup-0.1.16-BASE-0111.exe
