name: ONCA 0.1.22 DIAGNOSTIC
on:
  push:
    paths:
      - '.github/workflows/onca-022-diagnostic.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          .\scripts\rebuild-onca-016-final.ps1
          python .\scripts\apply_ui_018.py
          python .\scripts\apply_ui_019.py
          python .\scripts\apply_ui_020.py
          python .\scripts\apply_print_021.py
          python .\scripts\apply_features_022.py
      - name: Capture test output
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config 2>&1 | Tee-Object -FilePath ..\..\diagnostic-022.txt
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath ..\..\diagnostic-022-test.txt
          exit 0
      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostic-022*.txt
          git commit -m 'chore: capture 0.1.22 test diagnostics' || exit 0
          git push
