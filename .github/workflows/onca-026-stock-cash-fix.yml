name: ONCA 0.1.26 STOCK CASH FIX
on:
  push:
    paths:
      - 'scripts/apply_fix_026_stock_cash.py'
      - '.github/workflows/onca-026-stock-cash-fix.yml'
  workflow_dispatch:
jobs:
  build-test-release:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild approved base
        shell: pwsh
        run: .\scripts\rebuild-onca-016-final.ps1
      - name: Apply 0.1.18
        shell: pwsh
        run: python .\scripts\apply_ui_018.py
      - name: Apply 0.1.19
        shell: pwsh
        run: python .\scripts\apply_ui_019.py
      - name: Apply 0.1.20
        shell: pwsh
        run: python .\scripts\apply_ui_020.py
      - name: Apply 0.1.21 physical print
        shell: pwsh
        run: python .\scripts\apply_print_021.py
      - name: Apply 0.1.22 features
        shell: pwsh
        run: python .\scripts\apply_features_022.py
      - name: Fix nullable product id
        shell: pwsh
        run: python .\scripts\fix_022_guid.py
      - name: Apply 0.1.25 credit UI fix
        shell: pwsh
        run: python .\scripts\apply_ui_025.py
      - name: Apply 0.1.26 stock and cash fix
        shell: pwsh
        run: python .\scripts\apply_fix_026_stock_cash.py
      - name: Audit requested corrections
        shell: pwsh
        run: |
          $r='.\work-final\ONCA-PDV-PRO'
          $inv=Get-Content "$r\src\OncaPDV.Desktop\InventoryWindow.xaml" -Raw
          $cash=Get-Content "$r\src\OncaPDV.Desktop\OperationsWindow.xaml.cs" -Raw
          $main=Get-Content "$r\src\OncaPDV.Desktop\MainWindow.xaml.cs" -Raw
          foreach($s in @('EDITAR PRODUTO','+ ENTRADA','- SAÍDA','AJUSTAR SALDO')){if(-not $inv.Contains($s)){throw "Missing inventory action: $s"}}
          if(-not $cash.Contains('CAIXA FECHADO COM SUCESSO')){throw 'Cash closing confirmation missing'}
          if(-not $main.Contains('Deseja imprimir o comprovante?')){throw 'Print confirmation regressed'}
          if(-not $main.Contains('ConfiguredPhysicalPrintService')){throw 'Physical printing wiring regressed'}
      - name: Full regression tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
      - name: Build Desktop warnings as errors
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj --configfile .\NuGet.Config
          dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
      - name: Publish EXE
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\portable026
          Copy-Item '.\portable026\OncaPDV.Desktop.exe' '.\portable026\ONCA-PDV-PRO-0.1.26-ESTOQUE-CAIXA-FIX.exe' -Force
      - name: Smoke launch 5x
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $exe=Resolve-Path '.\portable026\ONCA-PDV-PRO-0.1.26-ESTOQUE-CAIXA-FIX.exe'
          1..5 | ForEach-Object {$p=Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru;if(-not $p.WaitForExit(30000)){try{$p.Kill($true)}catch{};throw "Smoke timeout $_"};if($p.ExitCode -ne 0){throw "Smoke failed $_"}}
      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.26-ESTOQUE-CAIXA-FIX
          path: work-final/ONCA-PDV-PRO/portable026/ONCA-PDV-PRO-0.1.26-ESTOQUE-CAIXA-FIX.exe
          retention-days: 14
          if-no-files-found: error
