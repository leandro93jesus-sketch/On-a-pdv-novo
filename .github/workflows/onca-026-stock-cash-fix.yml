name: ONCA 0.1.34 DUAL ARCH INSTALLER
on:
  push:
    paths:
      - 'scripts/apply_fix_026_stock_cash.py'
      - 'scripts/build_installer_034.ps1'
      - '.github/workflows/onca-026-stock-cash-fix.yml'
  workflow_dispatch:
jobs:
  build-test-release:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild approved base
        shell: pwsh
        run: .\scripts\rebuild-onca-016-final.ps1
      - name: Apply 0.1.18
        shell: pwsh
        run: python .\scripts\apply_ui_018.py
      - name: Apply 0.1.19
        shell: pwsh
        run: python .\scripts\apply_ui_019.py
      - name: Apply 0.1.20
        shell: pwsh
        run: python .\scripts\apply_ui_020.py
      - name: Apply 0.1.21 physical print
        shell: pwsh
        run: python .\scripts\apply_print_021.py
      - name: Apply 0.1.22 features
        shell: pwsh
        run: python .\scripts\apply_features_022.py
      - name: Fix nullable product id
        shell: pwsh
        run: python .\scripts\fix_022_guid.py
      - name: Apply 0.1.25 credit UI fix
        shell: pwsh
        run: python .\scripts\apply_ui_025.py
      - name: Apply 0.1.27 verified fixes
        shell: pwsh
        run: python .\scripts\apply_fix_026_stock_cash.py
      - name: Full regression tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
      - name: Build Desktop warnings as errors
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj --configfile .\NuGet.Config
          dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
      - name: Publish EXE
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\portable032
          Copy-Item '.\portable032\OncaPDV.Desktop.exe' '.\portable032\ONCA-PDV-PRO-0.1.32-AGUARDO-CANCELAR-ESTOQUE-TESTADO.exe' -Force
      - name: Publish x86 fallback
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\portable034x86
          Copy-Item '.\portable034x86\OncaPDV.Desktop.exe' '.\portable034x86\ONCA-PDV-PRO-x86.exe' -Force

      - name: Smoke launch 5x
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $exe=Resolve-Path '.\portable032\ONCA-PDV-PRO-0.1.32-AGUARDO-CANCELAR-ESTOQUE-TESTADO.exe'
          1..5 | ForEach-Object {
            $p=Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 5
            if($p.HasExited){throw "Smoke failed $_ - application exited early with code $($p.ExitCode)"}
            try{$p.CloseMainWindow() | Out-Null}catch{}
            Start-Sleep -Milliseconds 800
            if(-not $p.HasExited){try{$p.Kill($true)}catch{}}
            Write-Host "Smoke $_ OK - application stayed open"
          }
      - name: Build Windows installer
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: ..\..\scripts\build_installer_034.ps1

      - name: Test installer and installed EXE
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $setup=Resolve-Path '.\portable032\ONCA-PDV-PRO-Setup-0.1.34.exe'
          $dir=Join-Path $env:TEMP 'ONCA-PDV-PRO-INSTALL-TEST'
          if(Test-Path $dir){Remove-Item $dir -Recurse -Force}
          $p=Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$dir`"" -PassThru -Wait
          if($p.ExitCode -ne 0){throw "Installer failed with code $($p.ExitCode)"}
          $exe=Join-Path $dir 'ONCA-PDV-PRO.exe'
          if(-not (Test-Path $exe)){throw 'Installed EXE missing'}
          $app=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          if($app.HasExited){throw "Installed PDV exited early with code $($app.ExitCode)"}
          try{$app.CloseMainWindow() | Out-Null}catch{}
          Start-Sleep -Milliseconds 700
          if(-not $app.HasExited){try{$app.Kill($true)}catch{}}
          Write-Host 'Installer + installed EXE test OK'

      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-Setup-0.1.34.exe
          path: work-final/ONCA-PDV-PRO/portable032/ONCA-PDV-PRO-Setup-0.1.34.exe
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.32-AGUARDO-CANCELAR-ESTOQUE-TESTADO.exe
          path: work-final/ONCA-PDV-PRO/portable032/ONCA-PDV-PRO-0.1.32-AGUARDO-CANCELAR-ESTOQUE-TESTADO.exe
          retention-days: 14
          if-no-files-found: error
