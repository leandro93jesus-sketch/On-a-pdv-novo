name: ONCA 0.1.30 IMPROVED INVENTORY
on:
  push:
    paths:
      - 'scripts/apply_fix_026_stock_cash.py'
      - '.github/workflows/onca-026-stock-cash-fix.yml'
  workflow_dispatch:
jobs:
  build-test-release:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild approved base
        shell: pwsh
        run: .\scripts\rebuild-onca-016-final.ps1
      - name: Apply 0.1.18
        shell: pwsh
        run: python .\scripts\apply_ui_018.py
      - name: Apply 0.1.19
        shell: pwsh
        run: python .\scripts\apply_ui_019.py
      - name: Apply 0.1.20
        shell: pwsh
        run: python .\scripts\apply_ui_020.py
      - name: Apply 0.1.21 physical print
        shell: pwsh
        run: python .\scripts\apply_print_021.py
      - name: Apply 0.1.22 features
        shell: pwsh
        run: python .\scripts\apply_features_022.py
      - name: Fix nullable product id
        shell: pwsh
        run: python .\scripts\fix_022_guid.py
      - name: Apply 0.1.25 credit UI fix
        shell: pwsh
        run: python .\scripts\apply_ui_025.py
      - name: Apply 0.1.27 verified fixes
        shell: pwsh
        run: python .\scripts\apply_fix_026_stock_cash.py
      - name: Audit requested corrections
        shell: pwsh
        run: |
          $r='.\work-final\ONCA-PDV-PRO'
          $inv=Get-Content "$r\src\OncaPDV.Desktop\InventoryWindow.xaml" -Raw
          $cash=Get-Content "$r\src\OncaPDV.Desktop\OperationsWindow.xaml.cs" -Raw
          $main=Get-Content "$r\src\OncaPDV.Desktop\MainWindow.xaml.cs" -Raw
          foreach($s in @('CADASTRAR PRODUTO','EDITAR / ALTERAR PREÇO','+ ENTRADA','- SAÍDA','AJUSTAR QUANTIDADE')){if(-not $inv.Contains($s)){throw "Missing inventory action: $s"}}
          if(-not $cash.Contains('CAIXA FECHADO COM SUCESSO')){throw 'Cash closing confirmation missing'}
          if(-not $inv.Contains('Text="ESTOQUE"')){throw 'ESTOQUE title missing'}
          $svc=Get-Content "$r\src\OncaPDV.Infrastructure\InventoryService026.cs" -Raw
          if(-not $svc.Contains('if(!string.IsNullOrWhiteSpace(term))')){throw 'All-products inventory loading fix missing'}
          $safe=Get-Content "$r\src\OncaPDV.Desktop\SafePrintService027.cs" -Raw
          if(-not $safe.Contains('IMPRESSÃO DUPLICADA BLOQUEADA')){throw 'Duplicate print protection missing'}
          $report=Get-Content "$r\src\OncaPDV.Infrastructure\ReportService022.cs" -Raw
          if(-not $report.Contains('SpecialFolder.DesktopDirectory')){throw 'Sales report Desktop PDF fix missing'}
          if(-not $main.Contains('Deseja imprimir o comprovante?')){throw 'Print confirmation regressed'}
          $orders=Get-Content "$r\src\OncaPDV.Desktop\OrdersWindow.xaml.cs" -Raw
          if(-not $orders.Contains('Deseja imprimir o pedido')){throw 'Order print confirmation missing'}
          if(-not $orders.Contains('PrintDocument')){throw 'Order print action missing'}
          $ordersXaml=Get-Content "$r\src\OncaPDV.Desktop\OrdersWindow.xaml" -Raw
          if(-not $ordersXaml.Contains('IMPRIMIR PEDIDO')){throw 'Order print button missing'}
          if(-not $main.Contains('ConfiguredPhysicalPrintService')){throw 'Physical printing wiring regressed'}
          if(-not $inv.Contains('StringFormat=N0')){throw 'Whole-number inventory display missing'}
          $invcs=Get-Content "$r\src\OncaPDV.Desktop\InventoryWindow.xaml.cs" -Raw
          if(-not $invcs.Contains('q!=decimal.Truncate(q)')){throw 'Whole-number entry/exit validation missing'}
          if(-not $invcs.Contains('v!=decimal.Truncate(v)')){throw 'Whole-number balance validation missing'}
      - name: Full regression tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
      - name: Build Desktop warnings as errors
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj --configfile .\NuGet.Config
          dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
      - name: Publish EXE
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\portable030
          Copy-Item '.\portable030\OncaPDV.Desktop.exe' '.\portable030\ONCA-PDV-PRO-0.1.30-ESTOQUE-MELHORADO-TESTADO.exe' -Force
      - name: Smoke launch 5x
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $exe=Resolve-Path '.\portable030\ONCA-PDV-PRO-0.1.30-ESTOQUE-MELHORADO-TESTADO.exe'
          1..5 | ForEach-Object {$p=Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru;if(-not $p.WaitForExit(30000)){try{$p.Kill($true)}catch{};throw "Smoke timeout $_"};if($p.ExitCode -ne 0){throw "Smoke failed $_"}}
      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.30-ESTOQUE-MELHORADO-TESTADO.exe
          path: work-final/ONCA-PDV-PRO/portable030/ONCA-PDV-PRO-0.1.30-ESTOQUE-MELHORADO-TESTADO.exe
          retention-days: 14
          if-no-files-found: error
