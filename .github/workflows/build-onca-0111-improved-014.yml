name: Build ONCA 0.1.14 visible receive button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-onca-0111-improved-014.yml'
      - 'patches/onca-0111-melhorias-hoje.patch.gz.b64'
      - 'installer/ONCA-PDV-PRO-0.1.14-base0111.nsi'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract 0.1.11 visual base
        shell: pwsh
        run: |
          if (Test-Path ".\work") { Remove-Item ".\work" -Recurse -Force }
          New-Item -ItemType Directory -Path ".\work" | Out-Null
          Expand-Archive ".\ONCA-PDV-PRO-ATUALIZADO-0.1.3.zip" ".\work" -Force
          if (-not (Test-Path ".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop\MainWindow.xaml")) { throw "Base source not found." }

      - name: Apply today's improvements without redesign
        shell: pwsh
        run: |
          $encoded=(Get-Content ".\patches\onca-0111-melhorias-hoje.patch.gz.b64" -Raw) -replace "\s",""
          $gz=Join-Path $PWD "improvements.patch.gz"
          $patch=Join-Path $PWD "improvements.patch"
          [IO.File]::WriteAllBytes($gz,[Convert]::FromBase64String($encoded))
          $input=[IO.File]::OpenRead($gz)
          $output=[IO.File]::Create($patch)
          $gzip=[IO.Compression.GzipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          try { $gzip.CopyTo($output) } finally { $gzip.Dispose();$output.Dispose();$input.Dispose() }
          Push-Location ".\work\ONCA-PDV-PRO"
          try {
            git init | Out-Null
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) { throw "Improvement patch does not apply cleanly." }
            git apply $patch
            if ($LASTEXITCODE -ne 0) { throw "Failed to apply improvement patch." }
          } finally { Pop-Location }

      - name: Add improvement windows
        shell: pwsh
        run: |
          $src=".\patches\0.1.12"
          $dst=".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop"
          foreach($name in @("ProductSelectionWindow.xaml","ProductSelectionWindow.xaml.cs","DiversosWindow.xaml","DiversosWindow.xaml.cs")){
            Copy-Item (Join-Path $src $name) (Join-Path $dst $name) -Force
          }

      - name: Adapt improvement windows to 0.1.11 base
        shell: pwsh
        run: |
          $main=".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop\MainWindow.xaml.cs"
          $text=Get-Content $main -Raw
          $text=[regex]::Replace($text,'new ProductSelectionWindow\(([^,\r\n]+),\s*([^,\r\n\)]+)(,\s*(?:true|false))?\)','new ProductSelectionWindow($2, $1$3)')
          Set-Content $main $text -Encoding UTF8
          $div=".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop\DiversosWindow.xaml.cs"
          $d=Get-Content $div -Raw
          $d=$d.Replace('public decimal Price { get; private set; }',"public decimal Price { get; private set; }`r`n    public decimal Quantity => 1m;`r`n    public decimal UnitPrice => Price;")
          Set-Content $div $d -Encoding UTF8

      - name: Keep receive payment button always visible
        shell: pwsh
        run: |
          $file=".\work\ONCA-PDV-PRO\src\OncaPDV.Desktop\ReceiveCreditWindow.xaml"
          @'
          <Window x:Class="OncaPDV.Desktop.ReceiveCreditWindow"
                  xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
                  xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
                  Title="Receber crediário"
                  Width="500" Height="520" MinHeight="460" MinWidth="460"
                  WindowStartupLocation="CenterOwner" ResizeMode="CanResize">
            <Grid Margin="24">
              <Grid.RowDefinitions>
                <RowDefinition Height="*"/>
                <RowDefinition Height="Auto"/>
              </Grid.RowDefinitions>
              <ScrollViewer Grid.Row="0" VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled">
                <StackPanel>
                  <TextBlock x:Name="Customer" FontSize="22" FontWeight="Bold"/>
                  <TextBlock x:Name="Balance" FontSize="18" Margin="0,4,0,20"/>
                  <TextBlock Text="VALOR RECEBIDO"/>
                  <TextBox x:Name="AmountBox" FontSize="22"/>
                  <TextBlock Text="FORMA DE PAGAMENTO" Margin="0,15,0,0"/>
                  <ComboBox x:Name="MethodBox" FontSize="18">
                    <ComboBoxItem Content="Dinheiro" IsSelected="True"/>
                    <ComboBoxItem Content="Pix"/>
                    <ComboBoxItem Content="Débito"/>
                    <ComboBoxItem Content="Crédito"/>
                  </ComboBox>
                  <TextBlock Text="OBSERVAÇÃO" Margin="0,15,0,0"/>
                  <TextBox x:Name="NotesBox" MinHeight="50" TextWrapping="Wrap" AcceptsReturn="True"/>
                </StackPanel>
              </ScrollViewer>
              <Button Grid.Row="1" Content="CONFIRMAR RECEBIMENTO" Height="52" FontSize="18" FontWeight="Bold" Margin="0,18,0,0" Click="Confirm_Click"/>
            </Grid>
          </Window>
          '@ | Set-Content $file -Encoding UTF8

      - name: Align stale migration assertion
        shell: pwsh
        run: |
          $file=".\work\ONCA-PDV-PRO\tests\OncaPDV.Tests\BusinessModuleTests.cs"
          $text=Get-Content $file -Raw
          $text=$text.Replace('Assert.Equal(3,await e.Decimal("SELECT MAX(version) FROM schema_versions"))','Assert.Equal(4,await e.Decimal("SELECT MAX(version) FROM schema_versions"))')
          Set-Content $file $text -Encoding UTF8

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config

      - name: Run all tests including crediario
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Publish complete self-contained runtime
        shell: pwsh
        working-directory: .\work\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o .\publish-full
          if (-not (Test-Path ".\publish-full\OncaPDV.Desktop.exe")) { throw "Published EXE not found." }

      - name: Prepare installer
        shell: pwsh
        run: |
          $dst=".\installer\publish-full"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Copy-Item ".\work\ONCA-PDV-PRO\publish-full" $dst -Recurse -Force

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: .\installer
        run: |
          $makensis=(Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis=@("C:\Program Files (x86)\NSIS\makensis.exe","C:\Program Files\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $makensis) { throw "NSIS not found." }
          & $makensis ".\ONCA-PDV-PRO-0.1.14-base0111.nsi"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }

      - name: Install and launch app
        shell: pwsh
        working-directory: .\installer
        run: |
          $setup=Resolve-Path ".\ONCA-PDV-PRO-Setup-0.1.14-BASE-0111.exe"
          $dir=Join-Path $env:RUNNER_TEMP "ONCA-PDV-PRO-0111-IMPROVED-014"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $p=Start-Process -FilePath $setup -ArgumentList @("/S","/D=$dir") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer returned $($p.ExitCode)." }
          $exe=Join-Path $dir "OncaPDV.Desktop.exe"
          if (-not (Test-Path $exe)) { throw "Installed EXE missing." }
          $app=Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $app.WaitForExit(30000)) { try{$app.Kill($true)}catch{}; throw "App launch smoke test timed out." }
          if ($app.ExitCode -ne 0) { throw "App launch failed with $($app.ExitCode)." }
          Write-Host "INSTALL + APP LAUNCH OK"

      - name: Upload final installer
        uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.14-BASE-0111-FINAL
          retention-days: 7
          if-no-files-found: error
          path: installer/ONCA-PDV-PRO-Setup-0.1.14-BASE-0111.exe
