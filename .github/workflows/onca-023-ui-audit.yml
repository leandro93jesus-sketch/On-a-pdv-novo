name: ONCA 0.1.23 UI AUDIT
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_ui_023.py'
      - '.github/workflows/onca-023-ui-audit.yml'
jobs:
  build-test-release:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild approved base
        shell: pwsh
        run: .\scripts\rebuild-onca-016-final.ps1
      - name: Apply 0.1.18
        shell: pwsh
        run: python .\scripts\apply_ui_018.py
      - name: Apply 0.1.19
        shell: pwsh
        run: python .\scripts\apply_ui_019.py
      - name: Apply 0.1.20
        shell: pwsh
        run: python .\scripts\apply_ui_020.py
      - name: Apply 0.1.21 physical print
        shell: pwsh
        run: python .\scripts\apply_print_021.py
      - name: Apply 0.1.22 features
        shell: pwsh
        run: python .\scripts\apply_features_022.py
      - name: Fix nullable product id
        shell: pwsh
        run: python .\scripts\fix_022_guid.py
      - name: Apply 0.1.23 UI visibility
        shell: pwsh
        run: python .\scripts\apply_ui_023.py
      - name: Audit critical features
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='.\work-final\ONCA-PDV-PRO\src\OncaPDV.Desktop'
          $checks=@(
            @{f="$root\SalesManagementWindow.xaml"; s='EDITAR VENDA'},
            @{f="$root\SalesManagementWindow.xaml"; s='CANCELAR VENDA'},
            @{f="$root\SalesManagementWindow.xaml.cs"; s='Edit_Click'},
            @{f="$root\CreditWindow.xaml"; s='EDITAR RECEBIMENTO'},
            @{f="$root\CreditWindow.xaml"; s='APAGAR / ESTORNAR'},
            @{f="$root\CreditWindow.xaml.cs"; s='EditReceipt_Click'},
            @{f="$root\CreditWindow.xaml.cs"; s='ReverseReceipt_Click'},
            @{f="$root\ConfiguredPhysicalPrintService.cs"; s='WindowsRawPrintService'},
            @{f="$root\FinalizeChoiceWindow.xaml"; s='SEPARAR PEDIDO'},
            @{f="$root\OrdersWindow.xaml"; s='CONFIRMAR PAGAMENTO'}
          )
          foreach($c in $checks){if(-not (Select-String -Path $c.f -Pattern $c.s -SimpleMatch -Quiet)){throw "Missing: $($c.s) in $($c.f)"}}
      - name: Full regression tests
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj --configfile .\NuGet.Config
          dotnet test .\tests\OncaPDV.Tests\OncaPDV.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"
      - name: Build Desktop warnings as errors
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet restore .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj --configfile .\NuGet.Config
          dotnet build .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
      - name: Publish EXE
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          dotnet publish .\src\OncaPDV.Desktop\OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\portable023
          Copy-Item '.\portable023\OncaPDV.Desktop.exe' '.\portable023\ONCA-PDV-PRO-0.1.23-UI-REVISAO.exe' -Force
      - name: Smoke launch 5x
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: |
          $exe=Resolve-Path '.\portable023\ONCA-PDV-PRO-0.1.23-UI-REVISAO.exe'
          1..5 | ForEach-Object {$p=Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru;if(-not $p.WaitForExit(30000)){try{$p.Kill($true)}catch{};throw "Smoke timeout $_"};if($p.ExitCode -ne 0){throw "Smoke failed $_"}}
      - name: SHA256
        shell: pwsh
        working-directory: .\work-final\ONCA-PDV-PRO
        run: Get-FileHash '.\portable023\ONCA-PDV-PRO-0.1.23-UI-REVISAO.exe' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ONCA-PDV-PRO-0.1.23-UI-REVISAO
          path: work-final/ONCA-PDV-PRO/portable023/ONCA-PDV-PRO-0.1.23-UI-REVISAO.exe
          retention-days: 14
          if-no-files-found: error
