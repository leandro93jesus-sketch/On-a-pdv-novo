name: ONCA 0.2.3 operation pro Windows verified
on:
  push:
    branches: [feature/pro-0230]
    paths:
      - '.github/workflows/onca-0230-operation-pro.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build-release:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 0.2.2 release source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item input -ItemType Directory -Force | Out-Null
          gh release download v0.2.2-profissional --repo leandro93jesus-sketch/On-a-pdv-novo --pattern 'ONCA-PDV-PRO-0.2.2-CODIGO-FONTE.zip' --dir input --clobber
          if($LASTEXITCODE -ne 0){throw 'Could not download exact 0.2.2 source'}
          $zip=Resolve-Path 'input/ONCA-PDV-PRO-0.2.2-CODIGO-FONTE.zip'
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne 'bc6af548d3ec56e45e9c5aec96d7f3e1731365a176f82d2f9999eb458c0bc799'){throw "Wrong 0.2.2 source SHA: $hash"}
          Expand-Archive $zip.Path source -Force
          Write-Host 'EXACT_0220_SOURCE_CONFIRMED=YES'

      - name: Freeze sale printing and payment files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $known=@{
            'src/OncaPDV.Printing/OncaPDV.Printing.csproj'='e7913d793f45d94022bbeca97ca5642b978cd3fd323b007549a060c0bffe181e';
            'src/OncaPDV.Printing/PrinterDiscovery.cs'='45ca6253be689d76fb08714e5c84794426ed75cee62a46eb94b92a2a11146974';
            'src/OncaPDV.Printing/Printing.cs'='31efe29ba9ad4ec1045f65743ebdb810e0f4eb91057d8785ffba6f59975607c4';
            'src/OncaPDV.Desktop/ConfiguredPhysicalPrintService.cs'='f770c30860d7acfcc889151e58871f1ee067a948721df9ec551539c9bafd8de5';
            'src/OncaPDV.Desktop/PrinterSettingsWindow.xaml'='1f33cdf3accda854b3bf6c989416a64772611c3da1deda4815a6ff4e7fdd9faf';
            'src/OncaPDV.Desktop/PrinterSettingsWindow.xaml.cs'='c99b8b6b15e1e2e8db73118826a17552ca9aa5ea6979a0edb8d2f3f2577dedbb';
            'src/OncaPDV.Desktop/ReceiptPreviewWindow.xaml'='c8b26d4aa945ecb5c8ccdaa051f9a8e649e9734b19b64d82faf69b3b278c796b';
            'src/OncaPDV.Desktop/ReceiptPreviewWindow.xaml.cs'='d41a006fe0225001c92e2aff62b6e1ed82fed76c41c831c9870e64d0c2dc67b2';
            'src/OncaPDV.Desktop/PaymentWindow.xaml'='5d311ee2d20629814abcbb7c063ce68d464bfdc30862cfe4410b119ced39a6bc';
            'src/OncaPDV.Desktop/PaymentWindow.xaml.cs'='52c5ca6cc63df6827e4cf68b8294715eccaca72de39ad46bf89d17fee995d1fd'
          }
          foreach($f in $known.Keys){
            $p=Join-Path source $f
            if(-not(Test-Path $p)){throw "Frozen print file missing: $f"}
            $hash=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($hash -ne $known[$f]){throw "0.2.2 print baseline mismatch: $f => $hash"}
          }
          $main=Get-Content source/src/OncaPDV.Desktop/MainWindow.xaml.cs -Raw
          foreach($sentinel in @(
            'Deseja imprimir o comprovante?',
            '_printer.PrintAsync(new(sale, Cut:true))',
            'Deseja imprimir novamente a venda',
            '_printer.PrintAsync(new(sale,IsReprint:true,Cut:true))'
          )){if(-not $main.Contains($sentinel)){throw "0.2.2 print sentinel missing: $sentinel"}}
          Write-Host 'PRINTING_BASELINE_0220_CONFIRMED=YES'

      - name: Apply reviewed 0.2.3 operation patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -c "import base64,gzip,pathlib; parts=[pathlib.Path(f'patches/onca-0230-part{i:02d}.txt').read_text().strip() for i in range(1,3)]; pathlib.Path('onca0230.patch').write_bytes(gzip.decompress(base64.b64decode(''.join(parts))))"
          if($LASTEXITCODE -ne 0){throw 'Patch unpack failed'}
          $patch=(Resolve-Path onca0230.patch).Path
          $hash=(Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PATCH_SHA256=$hash"
          if($hash -ne '182b331d18020f361fd31e6b3bef7dfa7de2b74517ea0610766ea72d3cb4745e'){throw 'Patch SHA mismatch'}
          git apply --check --directory=source --whitespace=nowarn $patch
          if($LASTEXITCODE -ne 0){throw 'Patch incompatible with exact 0.2.2 source'}
          git apply --directory=source --whitespace=nowarn $patch
          if($LASTEXITCODE -ne 0){throw 'Patch apply failed'}
          Write-Host 'EXACT_0230_PATCH_APPLIED=YES'

      - name: Prove printing stayed frozen
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $known=@{
            'src/OncaPDV.Printing/OncaPDV.Printing.csproj'='e7913d793f45d94022bbeca97ca5642b978cd3fd323b007549a060c0bffe181e';
            'src/OncaPDV.Printing/PrinterDiscovery.cs'='45ca6253be689d76fb08714e5c84794426ed75cee62a46eb94b92a2a11146974';
            'src/OncaPDV.Printing/Printing.cs'='31efe29ba9ad4ec1045f65743ebdb810e0f4eb91057d8785ffba6f59975607c4';
            'src/OncaPDV.Desktop/ConfiguredPhysicalPrintService.cs'='f770c30860d7acfcc889151e58871f1ee067a948721df9ec551539c9bafd8de5';
            'src/OncaPDV.Desktop/PrinterSettingsWindow.xaml'='1f33cdf3accda854b3bf6c989416a64772611c3da1deda4815a6ff4e7fdd9faf';
            'src/OncaPDV.Desktop/PrinterSettingsWindow.xaml.cs'='c99b8b6b15e1e2e8db73118826a17552ca9aa5ea6979a0edb8d2f3f2577dedbb';
            'src/OncaPDV.Desktop/ReceiptPreviewWindow.xaml'='c8b26d4aa945ecb5c8ccdaa051f9a8e649e9734b19b64d82faf69b3b278c796b';
            'src/OncaPDV.Desktop/ReceiptPreviewWindow.xaml.cs'='d41a006fe0225001c92e2aff62b6e1ed82fed76c41c831c9870e64d0c2dc67b2';
            'src/OncaPDV.Desktop/PaymentWindow.xaml'='5d311ee2d20629814abcbb7c063ce68d464bfdc30862cfe4410b119ced39a6bc';
            'src/OncaPDV.Desktop/PaymentWindow.xaml.cs'='52c5ca6cc63df6827e4cf68b8294715eccaca72de39ad46bf89d17fee995d1fd'
          }
          foreach($f in $known.Keys){
            $hash=(Get-FileHash (Join-Path source $f) -Algorithm SHA256).Hash.ToLowerInvariant()
            if($hash -ne $known[$f]){throw "PRINTING FREEZE VIOLATION: $f"}
          }
          $main=Get-Content source/src/OncaPDV.Desktop/MainWindow.xaml.cs -Raw
          foreach($sentinel in @(
            'Deseja imprimir o comprovante?',
            '_printer.PrintAsync(new(sale, Cut:true))',
            'Deseja imprimir novamente a venda',
            '_printer.PrintAsync(new(sale,IsReprint:true,Cut:true))'
          )){if(-not $main.Contains($sentinel)){throw "PRINTING FLOW VIOLATION: $sentinel"}}
          Write-Host 'PRINTING_FREEZE_0230=PASS'
          Write-Host 'PRINT_CONFIRMATION_AND_REPRINT_0230=PASS'

      - name: Audit professional operation features
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @(
            'src/OncaPDV.Desktop/MainWindow.xaml',
            'src/OncaPDV.Desktop/QuickPriceScannerWindow.xaml',
            'src/OncaPDV.Desktop/DiversosWindow.xaml',
            'src/OncaPDV.Desktop/CreditWindow.xaml',
            'src/OncaPDV.Desktop/Finance052Window.xaml',
            'src/OncaPDV.Desktop/IntegrityCenter151Window.xaml'
          )){try{[xml](Get-Content $f -Raw)|Out-Null}catch{throw "Invalid XAML: $f"}}
          $main=Get-Content src/OncaPDV.Desktop/MainWindow.xaml -Raw
          foreach($required in @(
            'Header="DIVERSOS  [F4]"',
            'Content="Diversos" Click="Diversos_Click"',
            'Content="CONSULTA PREÇO  [F5]"',
            'Content="SALVAR EM ESPERA  [F6]"',
            'Content="RECUPERAR ESPERA  [F7]"',
            'x:Name="HealthText"',
            'x:Name="CashPulseText"',
            'x:Name="CustomerPulseText"',
            'x:Name="StockAlertBorder"',
            'x:Name="SaleToastBorder"',
            'TELA CHEIA [F11]',
            '3*código',
            '0.2.3'
          )){if(-not $main.Contains($required)){throw "Missing 0.2.3 checkout feature: $required"}}
          $code=Get-Content src/OncaPDV.Desktop/MainWindow.xaml.cs -Raw
          foreach($required in @(
            'ScannerCommand0230.TryParse',
            'CheckoutActionGuard0230',
            'QuickPriceScanner_Click',
            'ToggleFocusMode0230',
            'CustomerHistoryQuick_Click',
            'RefreshOperationalPulse0230',
            'StockAlert0230.Evaluate'
          )){if(-not $code.Contains($required)){throw "Missing 0.2.3 code feature: $required"}}
          if(-not(Test-Path 'src/OncaPDV.Infrastructure/ProfessionalCheckout0230.cs')){throw 'ProfessionalCheckout0230 service missing'}
          if(-not(Test-Path 'tests/OncaPDV.Tests/ProfessionalCheckout0230Tests.cs')){throw '0.2.3 tests missing'}
          Write-Host 'DIVERSOS_PRESERVED_0230=PASS'
          Write-Host 'OPERATION_PRO_FEATURES_0230=PASS'

      - name: Restore and run full regression
        shell: pwsh
        working-directory: source
        run: |
          dotnet restore tests/OncaPDV.Tests/OncaPDV.Tests.csproj --configfile NuGet.Config
          if($LASTEXITCODE -ne 0){throw 'Test restore failed'}
          dotnet test tests/OncaPDV.Tests/OncaPDV.Tests.csproj -c Release --no-restore --logger 'console;verbosity=minimal'
          if($LASTEXITCODE -ne 0){throw 'Tests failed; no release'}

      - name: Build WPF with warnings as errors
        shell: pwsh
        working-directory: source
        run: |
          dotnet restore src/OncaPDV.Desktop/OncaPDV.Desktop.csproj --configfile NuGet.Config
          if($LASTEXITCODE -ne 0){throw 'Desktop restore failed'}
          dotnet build src/OncaPDV.Desktop/OncaPDV.Desktop.csproj -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'WPF build failed; no release'}

      - name: Publish Windows folder and single EXE
        shell: pwsh
        working-directory: source
        run: |
          dotnet publish src/OncaPDV.Desktop/OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o package/ONCA-PDV-PRO-0.2.3-WIN64
          if($LASTEXITCODE -ne 0){throw 'Folder publish failed'}
          dotnet publish src/OncaPDV.Desktop/OncaPDV.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o package/single
          if($LASTEXITCODE -ne 0){throw 'Single EXE publish failed'}
          foreach($p in @('package/ONCA-PDV-PRO-0.2.3-WIN64/OncaPDV.Desktop.exe','package/single/OncaPDV.Desktop.exe')){
            if(-not(Test-Path $p)){throw "Missing EXE: $p"}
            $v=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $p).Path)
            if($v.FileVersion -ne '0.2.3.0'){throw "Wrong version metadata: $($v.FileVersion)"}
          }

      - name: Start both Windows builds with isolated DB
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          foreach($kind in @('ONCA-PDV-PRO-0.2.3-WIN64','single')){
            $exe=(Resolve-Path "package/$kind/OncaPDV.Desktop.exe").Path
            $env:ONCA_PDV_DATA_ROOT=Join-Path $env:RUNNER_TEMP ('onca023-'+$kind+'-'+[Guid]::NewGuid().ToString('N'))
            New-Item $env:ONCA_PDV_DATA_ROOT -ItemType Directory -Force|Out-Null
            $start=Get-Date
            $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
            Start-Sleep -Seconds 10
            $p.Refresh()
            if($p.HasExited){throw "$kind crashed at startup. Exit=$($p.ExitCode)"}
            if(-not(Test-Path (Join-Path $env:ONCA_PDV_DATA_ROOT 'data/onca-pdv-pro.db'))){throw "$kind did not initialize isolated DB"}
            $p.CloseMainWindow()|Out-Null
            Start-Sleep -Seconds 2
            $p.Refresh()
            if(-not $p.HasExited){$p.Kill($true)}
            $errors=@(Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$start;Level=2} -ErrorAction SilentlyContinue | Where-Object {$_.Message -like '*ONCA-PDV*' -or $_.Message -like '*OncaPDV*'})
            if($errors.Count){throw "Application errors in $kind startup"}
            Write-Host "$kind : WINDOWS_STARTUP_AND_ISOLATED_DB=PASS"
          }

      - name: Package and publish tested 0.2.3
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          @'
          ONÇA PDV PRO 0.2.3 — OPERAÇÃO PROFISSIONAL

          Melhorias de balcão:
          - quantidade por 3*CODIGO / 3xCODIGO
          - consulta rápida de preço F5
          - busca tolerante a pequenos erros de digitação
          - alerta de estoque baixo/zero sem bloquear venda
          - resumo do cliente e crediário no checkout
          - resumo diário por forma de pagamento
          - saúde do sistema e backup
          - tela cheia F11
          - proteção reforçada contra finalização duplicada
          - confirmação visual após venda
          - atalhos profissionais
          - multivendas, venda em espera e recuperação preservadas
          - DIVERSOS preservado como aba, menu, F4 e janela

          IMPRESSÃO CONGELADA: lógica de impressão, preview, reimpressão e PaymentWindow não foram alterados.
          Faça backup de %LOCALAPPDATA%\Onca PDV Pro antes de atualizar.
          Windows 10/11 x64. Sem assinatura digital.
          '@ | Set-Content package/ONCA-PDV-PRO-0.2.3-WIN64/LEIA-ME.txt -Encoding UTF8
          Compress-Archive -Path package/ONCA-PDV-PRO-0.2.3-WIN64 -DestinationPath ONCA-PDV-PRO-0.2.3-WINDOWS-PORTATIL.zip -CompressionLevel Optimal -Force
          Copy-Item package/single/OncaPDV.Desktop.exe ONCA-PDV-PRO-0.2.3-OPERACAO-PRO.exe
          New-Item source-clean -ItemType Directory -Force|Out-Null
          foreach($dir in @('src','tests','docs')){if(Test-Path $dir){Copy-Item $dir source-clean/$dir -Recurse -Force}}
          foreach($file in @('NuGet.Config','OncaPDV.slnx','README.md','AI-HANDOFF.md','AI-HANDOFF-0200.md','AI-HANDOFF-0210.md','AI-HANDOFF-0220.md','AI-HANDOFF-0230.md')){if(Test-Path $file){Copy-Item $file source-clean/$file -Force}}
          Get-ChildItem source-clean -Directory -Recurse|Where-Object {$_.Name -in @('bin','obj','TestResults','test-results','package')}|Sort-Object FullName -Descending|Remove-Item -Recurse -Force
          Get-ChildItem source-clean -File -Recurse|Where-Object {$_.Extension -in @('.exe','.db','.pdb')}|Remove-Item -Force
          Compress-Archive -Path source-clean/* -DestinationPath ONCA-PDV-PRO-0.2.3-CODIGO-FONTE.zip -CompressionLevel Optimal -Force
          Write-Host "DIRECT_EXE_SHA256=$((Get-FileHash ONCA-PDV-PRO-0.2.3-OPERACAO-PRO.exe -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "FOLDER_ZIP_SHA256=$((Get-FileHash ONCA-PDV-PRO-0.2.3-WINDOWS-PORTATIL.zip -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "SOURCE_ZIP_SHA256=$((Get-FileHash ONCA-PDV-PRO-0.2.3-CODIGO-FONTE.zip -Algorithm SHA256).Hash.ToLowerInvariant())"
          gh release create v0.2.3-operacao-pro ONCA-PDV-PRO-0.2.3-OPERACAO-PRO.exe ONCA-PDV-PRO-0.2.3-WINDOWS-PORTATIL.zip ONCA-PDV-PRO-0.2.3-CODIGO-FONTE.zip --repo leandro93jesus-sketch/On-a-pdv-novo --target ${{ github.sha }} --title "ONCA PDV PRO 0.2.3 - OPERACAO PROFISSIONAL" --notes "Pacote completo de melhorias operacionais sobre a 0.2.2. DIVERSOS, multivendas, venda em espera e recuperação permanecem. Impressão, preview, reimpressão e PaymentWindow permanecem congelados. Regressão completa, build WPF e abertura dos dois formatos Windows são obrigatórios antes desta release."
          if($LASTEXITCODE -ne 0){throw 'Release failed'}
