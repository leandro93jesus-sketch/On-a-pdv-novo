appId: br.com.oncaprodutos.pdv
productName: ONÇA PDV
copyright: ONÇA Produtos de Limpeza
# productVersion / fileVersion do Windows = package.json version (1.2.17)
buildVersion: '1.2.17'
artifactName: ONCA-PDV-Setup-${version}.${ext}
directories:
  output: release/dist
  buildResources: electron/assets
files:
  - electron/**/*
  - package.json
extraResources:
  - from: desktop-resources/app-server
    to: app-server
  - from: desktop-resources/web-dist
    to: web-dist
  - from: desktop-resources/node
    to: node
  - from: desktop-resources/PLATFORM.txt
    to: PLATFORM.txt
asar: true
# API roda via Node embutido em extraResources (fora do asar).
# Não empacotar app-server dentro do asar.
extraMetadata:
  main: electron/main.cjs
win:
  # zip/portable são geráveis em CI Linux; NSIS completo recomenda agente Windows.
  target:
    - target: zip
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  icon: electron/assets/icon.ico
  requestedExecutionLevel: asInvoker
  # Wine disponível: grava ProductVersion/FileVersion 1.2.14 no PE do EXE
  signAndEditExecutable: true
  signDlls: false
  forceCodeSigning: false
  legalTrademarks: ONÇA Produtos de Limpeza

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ONÇA PDV
  uninstallDisplayName: ONÇA PDV
  # CRÍTICO: nunca apagar AppData/banco do usuário na desinstalação/atualização
  deleteAppDataOnUninstall: false
  packElevateHelper: false
  runAfterFinish: false
  artifactName: ONCA-PDV-Setup-${version}.${ext}
  license: release/LICENSE.txt
  include: electron/nsis/installer.nsh
  warningsAsErrors: false
  # Evita pós-processamento que exige Wine estável neste ambiente
  differentialPackage: false
linux:
  # tar.gz não depende de FUSE (AppImage falha sem libfuse2 em Ubuntu 24.04+)
  target:
    - AppImage
    - tar.gz
    - dir
  category: Office
  executableName: onca-pdv
  artifactName: ONCA-PDV-${version}-linux-x86_64.${ext}
  synopsis: ONÇA PDV — ponto de venda local-first
  description: Sistema profissional de PDV com SQLite local. Dados em ~/.config (não dentro do AppImage).
mac:
  target: dir
# Electron 33+ = Windows 10/11. Sem suporte declarado a Windows 7.
electronVersion: 33.2.1
